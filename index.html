<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>English — A1 to C1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Theme: pen-blue ink on white paper; light gold is kept for achievements only
   (streak, trophy, finished levels, owner badge, the "known" mark). */
:root{
  --bg:#F5F7FC; --paper:#FFFFFF; --panel:#FFFFFF; --panel2:#EEF2FB; --panel3:#E4EBF9;
  --line:rgba(28,63,148,.12); --line2:rgba(28,63,148,.24);
  --ink:#1C3F94; --ink2:#2F5BD3; --ink-d:#E8EEFB; --ink-dd:#0F2A6B;
  --tx:#0F1F47; --dim:#56678A; --dim2:#8794B0;
  --gold:#A9821C; --gold-l:#F1D88A; --gold-bg:#FBF3D9;
  --mint:#14885A; --mint-d:#E2F5EC; --coral:#C93C3C; --coral-d:#FCEBEB;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --fa:"Vazirmatn","Geeza Pro","Damascus","Tahoma",-apple-system,system-ui,sans-serif;
  --r:20px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --grad:linear-gradient(135deg,#2F5BD3,#1C3F94);
  --goldgrad:linear-gradient(135deg,#F6E3A6,#E2BE5A);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70% 40% at 10% 0%,rgba(47,91,211,.10),transparent 60%),radial-gradient(50% 30% at 95% 5%,rgba(241,216,138,.22),transparent 60%),linear-gradient(180deg,#FFFFFF,var(--bg) 50%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.fa{font-family:var(--fa);direction:rtl;unicode-bidi:isolate;text-align:right}
.fa.c,.c .fa{text-align:center}
#app,#gate,#run{position:relative;z-index:1}
#gate{display:none;min-height:100vh;flex-direction:column;justify-content:center;padding:calc(30px + var(--sat)) 22px calc(30px + var(--sab));max-width:520px;margin:0 auto}
#app{display:none;max-width:560px;margin:0 auto;padding:calc(14px + var(--sat)) 16px calc(110px + var(--sab))}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:800}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0;color:var(--ink-dd)}
.h2{font-size:20px;font-weight:750;letter-spacing:-.01em;color:var(--ink-dd)}
.h3{font-size:16px;font-weight:700;color:var(--ink-dd)}
.sm{font-size:14px;color:var(--dim)}
.xs{font-size:12px;color:var(--dim2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:0 6px 22px rgba(28,63,148,.07)}
.card.tap{display:block;width:100%;text-align:left;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.glow{background:linear-gradient(160deg,#FFFFFF,#EEF3FF);border-color:rgba(47,91,211,.35);box-shadow:0 10px 30px rgba(28,63,148,.14)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.sec{margin:22px 4px 6px}
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;text-align:center;box-shadow:0 8px 22px rgba(28,63,148,.28)}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;border:1.5px solid var(--line2);color:var(--ink);box-shadow:none}
.btn.ghost{background:var(--ink-d);color:var(--ink);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn.inl{display:inline-block;width:auto}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--ink-d);color:var(--ink)}
.chip.gold{background:var(--goldgrad);color:#5A430A;box-shadow:0 2px 8px rgba(226,190,90,.35)}
.chip.mint{background:var(--mint-d);color:var(--mint)}
.chip.blue{background:var(--ink-d);color:var(--ink)}
.lv-A1{--lc:#2F9E6B}.lv-A2{--lc:#1F8A9E}.lv-B1{--lc:#2F5BD3}.lv-B2{--lc:#6A4FD0}.lv-C1{--lc:#A9821C}
.lvchip{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:900;color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,white)}
.typebox{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;outline:none;font-size:17px;text-align:center}
.typebox:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(47,91,211,.15)}
.bar{height:8px;border-radius:99px;background:var(--ink-d);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.bar.gold>i{background:var(--goldgrad)}
.av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;font-weight:900;font-size:18px;flex:none}
.who{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin:8px 0;text-align:left}
.icob{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:var(--ink-d);color:var(--ink);font-size:17px;flex:none}
.icob:active{transform:scale(.92)}
.say{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--ink-d);color:var(--ink);font-size:15px;flex:none}
.say.big{width:64px;height:64px;font-size:26px;background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(28,63,148,.3)}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));z-index:5;display:flex;gap:2px;padding:6px;border-radius:24px;background:rgba(255,255,255,.92);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(15,31,71,.16);width:min(540px,calc(100% - 20px))}
#tabs button{flex:1;padding:7px 2px 6px;border-radius:18px;font-size:10.5px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button b{font-size:20px;line-height:1.1;font-weight:400}
#tabs button.on{background:var(--ink-d);color:var(--ink)}
#run{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column}
#run::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 40% at 50% 0%,rgba(47,91,211,.09),transparent 60%),linear-gradient(180deg,#FFFFFF,var(--bg))}
.runtop{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 8px}
.runbody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(24px + var(--sab));max-width:560px;width:100%;margin:0 auto}
.runbar{flex:1}
.opt{display:block;width:100%;padding:15px 16px;margin:9px 0;border-radius:16px;background:#fff;border:1.5px solid var(--line2);font-size:17px;font-weight:600;text-align:center;color:var(--ink-dd);transition:transform .1s;box-shadow:0 2px 8px rgba(28,63,148,.05)}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--mint-d);border-color:var(--mint);color:var(--mint)}
.opt.bad{background:var(--coral-d);border-color:var(--coral);color:var(--coral)}
.opt.fa{font-size:18px;text-align:center}
.prompt{text-align:center;margin:18px 0 8px}
.prompt .w{font-size:34px;font-weight:850;letter-spacing:-.02em;color:var(--ink)}
.prompt .fa{font-size:26px;text-align:center}
.feedback{margin-top:12px;padding:14px;border-radius:16px;font-size:15px}
.feedback.ok{background:var(--mint-d);color:#0E5E3E}
.feedback.bad{background:var(--coral-d);color:#8E2626}
.gap{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--ink2);color:var(--ink2)}
/* 3D picture: a deep pen-blue tile with a thin gold rim, floating */
.stage{perspective:700px;display:flex;justify-content:center;margin:8px 0 4px;touch-action:none}
.pic3d{width:150px;height:150px;border-radius:38px;display:flex;align-items:center;justify-content:center;font-size:92px;
  background:radial-gradient(120% 120% at 28% 18%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(160deg,#3B66DA,#142F75);
  border:2px solid rgba(241,216,138,.75);box-shadow:0 28px 44px rgba(15,42,107,.32),inset 0 1px 0 rgba(255,255,255,.35);
  transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-10deg));transform-style:preserve-3d;animation:float3d 5s ease-in-out infinite}
.pic3d span{display:block;transform:translateZ(38px);filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}
.pic3d.tile{font-size:64px;font-weight:900;color:#fff;background:radial-gradient(120% 120% at 28% 18%,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),linear-gradient(160deg,#6F8FE6,#2F5BD3)}
@keyframes float3d{0%,100%{translate:0 0}50%{translate:0 -8px}}
.mini{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,#3B66DA,#142F75);font-size:24px;flex:none}
.mini.tile{background:var(--ink-d);color:var(--ink);font-weight:900;font-size:17px}
.svgpic{display:block;width:96px;height:96px}
.svgpic svg{width:100%;height:100%}
.svgpic.sm{width:32px;height:32px}
.syn{display:inline-block;margin:3px 4px 0 0;padding:3px 10px;border-radius:999px;background:var(--ink-d);color:var(--ink);font-size:13px;font-weight:600}
.ex{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.ex .en{font-size:16px;font-weight:600}
.ex .fa{font-size:15px;color:var(--dim);margin-top:4px}
.dl{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.dl.r{flex-direction:row-reverse}
.bub{max-width:82%;padding:10px 13px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(28,63,148,.05)}
.dl.r .bub{background:var(--ink-d);border-color:rgba(47,91,211,.25)}
.bub.now{box-shadow:0 0 0 2px var(--ink2)}
.bub .fa{font-size:14px;color:var(--dim);margin-top:4px}
.spk{font-size:11px;font-weight:800;color:var(--ink2);margin-bottom:2px}
.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:50;padding:11px 18px;border-radius:14px;background:var(--ink-dd);color:#fff;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(15,31,71,.3);max-width:90%;text-align:center}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:30;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:18px;background:#fff;border:1.5px solid var(--ink2);font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(15,31,71,.2);white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:12px;background:var(--ink-d);font-size:13px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--ink);color:#fff}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.ring{width:58px;height:58px;flex:none}
.stat{flex:1;text-align:center;padding:12px 6px;border-radius:16px;background:var(--panel2)}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat.gold{background:var(--gold-bg)}
.stat.gold b{color:var(--gold)}
.road{position:relative;padding-left:22px}
.road::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(#2F9E6B,#2F5BD3,#6A4FD0,#E2BE5A)}
.road .card{position:relative}
.road .card::before{content:"";position:absolute;left:-20px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 4px var(--bg)}
.road .card.done{border-color:var(--gold-l);background:linear-gradient(160deg,#FFFFFF,var(--gold-bg))}
.done-mark{color:var(--gold);font-weight:900}
.hide{display:none!important}
.rule{padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ink-d);border:1px solid rgba(47,91,211,.25)}
.tip .eyebrow{color:var(--ink)!important}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pairs button{padding:12px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line2);font-weight:700;color:var(--ink-dd)}
.trophy{display:inline-flex;align-items:center;justify-content:center;width:110px;height:110px;border-radius:34px;background:var(--goldgrad);font-size:62px;box-shadow:0 16px 36px rgba(226,190,90,.45)}
select.typebox{appearance:auto}

</style>
</head>

<script>

w":[["compromise","n","سازش، مصالحه","middle ground","We need to find a compromise.","باید راه میانه‌ای پیدا کنیم.",""],["leverage","n","اهرم فشار، نفوذ","bargaining power","Our experience gives us leverage.","تجربهٔ ما به ما اهرم فشار می‌دهد.",""],["concession","n","امتیاز (در مذاکره)","","They made a small concession on price.","در قیمت امتیاز کوچکی دادند.",""],["counter-offer","n","پیشنهاد متقابل","","We'll make a counter-offer tomorrow.","فردا یک پیشنهاد متقابل می‌دهیم.",""],["non-negotiable","adj","غیرقابل مذاکره","fixed, firm","The safety standards are non-negotiable.","استانداردهای ایمنی قابل مذاکره نیست.",""],["win-win","adj","برد-برد","mutually beneficial","Let's find a win-win solution.","بیایید راه‌حلی برد-برد پیدا کنیم.",""],["meet halfway","phr","در میانهٔ راه به توافق رسیدن","split the difference","Could we meet halfway on the price?","می‌شود در قیمت وسط راه به توافق برسیم؟",""],["bargaining chip","n","برگ برنده (در مذاکره)","trump card","Our fast delivery time is a strong bargaining chip.","زمان تحویل سریع ما برگ برندهٔ قوی‌ای است.",""],["persuasive","adj","قانع‌کننده","convincing, compelling","She made a persuasive argument.","او استدلال قانع‌کننده‌ای ارائه کرد.",""],["emphasise","v","تأکید کردن","stress, highlight","I'd like to emphasise the long-term savings.","می‌خواهم بر صرفه‌جویی بلندمدت تأکید کنم.",""],["outweigh","v","سنگین‌تر بودن، بیشتر بودن (از نظر اهمیت)","exceed","The benefits outweigh the costs.","مزایا بر هزینه‌ها می‌چربد.",""],["reluctant","adj","بی‌میل، مردد","unwilling, hesitant","He was reluctant to sign.","برای امضا کردن بی‌میل بود.",""],["take into account","phr","در نظر گرفتن","consider","Please take into account the delivery time.","لطفاً زمان تحویل را در نظر بگیرید.",""],["commitment","n","تعهد","dedication, pledge","We need a two-year commitment.","به تعهد دوساله نیاز داریم.",""],["terms","n","شرایط (قرارداد)","conditions","We agreed on the terms.","بر سر شرایط توافق کردیم.",""],["deal-breaker","n","عامل بر هم زدن معامله","","The late penalty is a deal-breaker for us.","جریمهٔ تأخیر برای ما عامل بر هم خوردن معامله است.",""]],"d":{"t":"Negotiating a contract","fa":"مذاکرهٔ قرارداد","sp":["Client","Shahin"],"l":[[0,"Your proposal is persuasive, but the price is higher than we expected.","پیشنهادتان قانع‌کننده است، اما قیمت از انتظارمان بالاتر است."],[1,"I understand. However, I'd like to emphasise the long-term savings.","متوجهم. با این حال، می‌خواهم بر صرفه‌جویی بلندمدت تأکید کنم."],[0,"We've taken that into account. Still, could you meet us halfway?","آن را در نظر گرفته‌ایم. با این حال، می‌شود در میانهٔ راه به توافق برسیم؟"],[1,"We could offer a five percent discount if you commit to three years.","اگر سه سال تعهد بدهید، می‌توانیم پنج درصد تخفیف بدهیم."],[0,"Three years is a lot. We're reluctant to go beyond two.","سه سال زیاد است. تمایلی نداریم بیش از دو سال باشد."],[1,"Then I'd suggest four percent for two years, including maintenance.","پس پیشنهاد می‌کنم چهار درصد برای دو سال، شامل نگهداری."],[0,"That sounds like a reasonable compromise.","به نظر سازش معقولی است."],[1,"Great. I'll send the revised terms this afternoon.","عالی. شرایط اصلاح‌شده را امروز بعدازظهر می‌فرستم."]],"q":[{"q":"What is the final offer?","fa":"پیشنهاد نهایی چیست؟","o":["4% for two years, including maintenance","5% for three years","10% for one year"]},{"q":"Why does the client hesitate at first?","fa":"چرا مشتری در ابتدا تردید دارد؟","o":["Three years is too long a commitment","The quality is poor","There is no discount"]}]}},{"id":"u29","lv":"C1","t":"Advanced collocations","fa":"هم‌آیندهای پیشرفته","i":"🔗","w":[["raise awareness","phr","آگاهی‌رسانی کردن، افزایش آگاهی","inform the public","The campaign aims to raise awareness of mental health.","این کمپین برای افزایش آگاهی دربارهٔ سلامت روان است.",""],["pose a threat","phr","تهدیدی به شمار رفتن","endanger","Rising sea levels pose a threat to coastal cities.","بالا آمدن سطح دریا تهدیدی برای شهرهای ساحلی است.",""],["draw a conclusion","phr","نتیجه گرفتن","conclude","It's too early to draw any conclusions.","برای نتیجه‌گیری هنوز خیلی زود است.",""],["make a living","phr","امرار معاش کردن","earn a living","He makes a living as a translator.","از راه مترجمی امرار معاش می‌کند.",""],["take responsibility","phr","مسئولیت پذیرفتن","be accountable","Leaders must take responsibility for mistakes.","رهبران باید مسئولیت اشتباهات را بپذیرند.",""],["meet a need","phr","نیازی را برطرف کردن","satisfy a need","The new clinic meets a real need.","کلینیک جدید یک نیاز واقعی را برطرف می‌کند.",""],["bear in mind","phr","در نظر داشتن","remember, consider","Bear in mind that prices may change.","در نظر داشته باش که قیمت‌ها ممکن است تغییر کنند.",""],["come to terms with","phr","با چیزی کنار آمدن","accept","She's still coming to terms with the loss.","هنوز دارد با این فقدان کنار می‌آید.",""],["play a key role","phr","نقش کلیدی ایفا کردن","be central to","Storage plays a key role in the energy transition.","ذخیره‌سازی نقشی کلیدی در گذار انرژی دارد.",""],["heavily dependent","phr","به‌شدت وابسته","reliant","The economy is heavily dependent on oil.","اقتصاد به‌شدت به نفت وابسته است.",""],["widely accepted","phr","به‌طور گسترده پذیرفته‌شده","generally agreed","It's widely accepted that exercise reduces stress.","به‌طور گسترده پذیرفته شده که ورزش استرس را کاهش می‌دهد.",""],["a sharp rise","phr","افزایش شدید","a steep increase","There's been a sharp rise in prices.","قیمت‌ها افزایش شدیدی داشته‌اند.","📈"],["a vicious circle","phr","دور باطل","a downward spiral","Debt can become a vicious circle.","بدهی می‌تواند به دور باطل تبدیل شود.",""],["fall short of","phr","کمتر از حد انتظار بودن","fail to reach","The results fell short of expectations.","نتایج کمتر از انتظار بود.",""],["deeply rooted","phr","ریشه‌دار","entrenched","These traditions are deeply rooted.","این سنت‌ها ریشه‌دارند.",""],["sustainable growth","phr","رشد پایدار","long-term growth","The goal is sustainable growth.","هدف، رشد پایدار است.",""]],"d":{"t":"A podcast interview","fa":"مصاحبهٔ پادکست","sp":["Host","Dr Ahmadi"],"l":[[0,"Dr Ahmadi, why is battery storage suddenly in the headlines?","دکتر احمدی، چرا ذخیره‌سازی باتری ناگهان تیتر خبرها شده؟"],[1,"Because it plays a key role in making renewable energy reliable.","چون نقشی کلیدی در قابل اتکا کردن انرژی تجدیدپذیر دارد."],[0,"Some say we're still heavily dependent on gas, though.","ولی بعضی‌ها می‌گویند هنوز به‌شدت به گاز وابسته‌ایم."],[1,"That's true. Bear in mind that the transition takes decades.","درست است. در نظر داشته باشید که این گذار دهه‌ها طول می‌کشد."],[0,"Have recent projects met expectations?","آیا پروژه‌های اخیر انتظارات را برآورده کرده‌اند؟"],[1,"Some fell short of them, but it's too early to draw firm conclusions.","برخی کمتر از انتظار بودند، اما برای نتیجه‌گیری قطعی خیلی زود است."],[0,"What's the biggest challenge?","بزرگ‌ترین چالش چیست؟"],[1,"Raising awareness. People need to see it as sustainable growth, not just cost.","آگاهی‌رسانی. مردم باید آن را رشد پایدار ببینند، نه فقط هزینه."]],"q":[{"q":"Why is battery storage important, according to Dr Ahmadi?","fa":"به گفتهٔ دکتر احمدی، چرا ذخیره‌سازی باتری مهم است؟","o":["It makes renewable energy reliable","It is cheaper than gas","It replaces solar panels"]},{"q":"What does she say about recent projects?","fa":"دربارهٔ پروژه‌های اخیر چه می‌گوید؟","o":["It's too early for firm conclusions","They all failed","They were all successful"]}]}},{"id":"u30","lv":"C1","t":"Fluent expressions & nuance","fa":"عبارات روان و ظرافت‌های معنایی","i":"✨","w":[["by and large","phr","روی هم رفته","on the whole, generally","By and large, the trip went well.","روی هم رفته، سفر خوب پیش رفت.",""],["for what it's worth","phr","اگر نظر من برایت ارزشی دارد","in my humble opinion","For what it's worth, I think you're right.","اگر نظرم برایت مهم است، فکر می‌کنم حق با توست.",""],["to put it mildly","phr","به زبان ملایم بگویم","to say the least","The service was slow, to put it mildly.","به زبان ملایم بگویم، خدماتشان کند بود.",""],["as it happens","phr","از قضا، اتفاقاً","actually, coincidentally","As it happens, I know the manager.","اتفاقاً، مدیر را می‌شناسم.",""],["that said","phr","با این همه، با این حال","having said that","It's expensive. That said, it's excellent.","گران است. با این همه، عالی است.",""],["off the top of my head","phr","بدون فکر قبلی، همین‌طور سرسری","without checking","Off the top of my head, about fifty people.","همین‌طوری که به ذهنم می‌رسد، حدود پنجاه نفر.",""],["the bottom line is","phr","خلاصهٔ کلام اینکه","the main point is","The bottom line is, we need more time.","خلاصهٔ کلام اینکه، وقت بیشتری لازم داریم.",""],["a blessing in disguise","phr","خیر پنهان (عدو شود سبب خیر)","a hidden benefit","Losing that job was a blessing in disguise.","از دست دادن آن شغل در واقع خیری پنهان بود.",""],["read between the lines","phr","منظور پنهان را فهمیدن","understand the hidden meaning","Read between the lines: he's not happy.","منظور پنهانش را بفهم: او راضی نیست.",""],["go the extra mile","phr","بیش از انتظار تلاش کردن","make an extra effort","She always goes the extra mile for clients.","او همیشه برای مشتریان بیش از انتظار مایه می‌گذارد.",""],["beat around the bush","phr","طفره رفتن، حاشیه رفتن","avoid the point","Stop beating around the bush and tell me.","حاشیه نرو و بگو.",""],["take something with a pinch of salt","phr","چیزی را با احتیاط/تردید پذیرفتن","be sceptical","Take his advice with a pinch of salt.","توصیه‌اش را با احتیاط بپذیر.",""],["food for thought","phr","مایهٔ تأمل","something to think about","Your talk gave me food for thought.","صحبتت مایهٔ تأمل بود.",""],["in the long run","phr","در درازمدت","eventually, over time","It's cheaper in the long run.","در درازمدت ارزان‌تر است.",""],["a steep learning curve","phr","دورهٔ یادگیری فشرده و سخت","a lot to learn quickly","The new job has a steep learning curve.","کار جدید یادگیری سنگینی می‌طلبد.",""],["hold your horses","phr","صبر کن، عجله نکن","wait, slow down","Hold your horses! Let's read the contract first.","صبر کن! اول قرارداد را بخوانیم.",""]],"d":{"t":"Giving honest advice","fa":"نصیحت صادقانه","sp":["Olivia","Dariush"],"l":[[1,"I've been offered a job abroad. Should I take it?","به من یک کار در خارج پیشنهاد شده. قبولش کنم؟"],[0,"For what it's worth, I think it's a great opportunity.","اگر نظرم برایت مهم است، فکر می‌کنم فرصت فوق‌العاده‌ای است."],[1,"The salary is good, but the contract is, to put it mildly, unclear.","حقوقش خوب است، ولی قراردادش، به زبان ملایم بگویم، مبهم است."],[0,"Hold your horses, then. Ask them to clarify everything first.","پس عجله نکن. اول از آن‌ها بخواه همه‌چیز را روشن کنند."],[1,"The recruiter says it's standard. Should I believe him?","کارمند جذب می‌گوید عادی است. حرفش را باور کنم؟"],[0,"I'd take that with a pinch of salt. Read between the lines.","من بودم با احتیاط می‌پذیرفتم. منظور پنهانش را بفهم."],[1,"You're right. That said, I really want the experience.","حق با توست. با این حال، واقعاً این تجربه را می‌خواهم."],[0,"Then go for it, but in the long run, a clear contract protects you.","پس برو سراغش، ولی در درازمدت، یک قرارداد شفاف از تو محافظت می‌کند."]],"q":[{"q":"What is the problem with the job offer?","fa":"مشکل پیشنهاد کاری چیست؟","o":["The contract is unclear","The salary is low","It's too far from home"]},{"q":"What does Olivia advise?","fa":"اولیویا چه توصیه‌ای می‌کند؟","o":["Get everything clarified before deciding","Refuse the offer immediately","Trust the recruiter"]}]}}],"grammar":[{"id":"g01","lv":"A1","t":"The verb 'to be': am / is / are","fa":"فعل بودن: am / is / are","r":[["I am · you/we/they are · he/she/it is.","I با am، با you/we/they فعل are، و با he/she/it فعل is می‌آید."],["Short forms: I'm, you're, he's, she's, it's, we're, they're.","در گفتار معمولاً شکل کوتاه به کار می‌رود: I'm, he's, they're."],["Negative: add not → I'm not, he isn't, they aren't.","منفی: not اضافه کنید ← I'm not, he isn't, they aren't."],["Question: put the verb first → Are you tired? Is she here?","سؤالی: فعل را به اول جمله بیاورید ← Are you tired?"]],"ex":[["I'm a student.","من دانشجو هستم."],["She's from Tabriz.","او اهل تبریز است."],["We aren't late.","ما دیر نکرده‌ایم."],["Are they your parents?","آن‌ها پدر و مادرت هستند؟"],["It isn't expensive.","گران نیست."],["Is your brother married?","برادرت ازدواج کرده؟"],["You're right.","حق با توست."]],"tip":"در فارسی گاهی فعل «است» حذف می‌شود («من خسته»)، اما در انگلیسی جملهٔ بدون فعل غلط است: I am tired، نه I tired.","d":[["She ___ a doctor.","is","are","am"],["I ___ from Iran.","am","is","are"],["They ___ at home.","are","is","am"],["___ you hungry?","Are","Is","Am"],["He ___ not my teacher.","is","are","am"],["We ___ friends.","are","is","be"],["It ___ cold today.","is","are","am"],["My parents ___ in Shiraz.","are","is","am"]]},{"id":"g02","lv":"A1","t":"Articles: a, an, the","fa":"حروف تعریف: a، an، the","r":[["Use a/an with one thing mentioned for the first time: a book, an apple.","a/an برای یک چیزِ نامعین یا اولین بار ذکرشده: a book."],["Use an before a vowel SOUND: an hour, an egg, but a university.","an قبل از صدای مصوت: an hour (h تلفظ نمی‌شود)، ولی a university (با صدای «یو»)."],["Use the when both people know which one: the sun, the door, the book I bought.","the وقتی هر دو طرف می‌دانند منظور کدام است: the sun."],["Jobs need a/an: She's a nurse. No article for general plurals: I like cats.","قبل از شغل a/an لازم است: She's a nurse. برای جمع کلی حرف تعریف نمی‌آید: I like cats."]],"ex":[["I have a car. The car is red.","یک ماشین دارم. ماشین قرمز است."],["She's an engineer.","او مهندس است."],["Close the window, please.","لطفاً پنجره را ببند."],["It takes an hour.","یک ساعت طول می‌کشد."],["He's a university teacher.","او استاد دانشگاه است."],["Dogs are friendly.","سگ‌ها مهربان‌اند."],["The moon is beautiful tonight.","ماه امشب زیباست."]],"tip":"فارسی حرف تعریف معین ندارد، به همین دلیل فارسی‌زبان‌ها اغلب a/the را جا می‌اندازند: «He is engineer» غلط است؛ درست: He is an engineer.","d":[["I'm ___ teacher.","a","an","the"],["She eats ___ apple every day.","an","a","the"],["Can you open ___ door, please?","the","a","an"],["It takes ___ hour by train.","an","a","—"],["He studies at ___ university in Tehran.","a","an","the"],["I like ___ music.","—","a","an"],["Look at ___ sun!","the","a","an"],["My father is ___ engineer.","an","a","the"]]},{"id":"g31","lv":"A1","t":"Possessives: my, your, his… and 's","fa":"ملکی‌ها: my، your، his… و ‎'s","r":[["I → my, you → your, he → his, she → her, it → its, we → our, they → their.","صفت ملکی قبل از اسم می‌آید: my book (کتابِ من)."],["People own things with 's: Ali's car, my mother's name.","مالکیت افراد با ‎'s: Ali's car (ماشینِ علی)."],["Plural nouns ending in -s take only ': my parents' house.","اسم جمعِ دارای s فقط ' می‌گیرد: my parents' house."],["Whose…? asks about the owner: Whose bag is this?","Whose…? یعنی «مالِ چه کسی؟»"]],"ex":[["This is my brother.","این برادرِ من است."],["Her name is Mina.","اسمِ او میناست."],["Their house is very big.","خانه‌شان خیلی بزرگ است."],["Sara's husband is a doctor.","شوهرِ سارا دکتر است."],["The dog is eating its food.","سگ دارد غذایش را می‌خورد."],["Whose phone is this? — It's Reza's.","این گوشیِ کیست؟ — مالِ رضاست."],["We visited my parents' new flat.","به آپارتمان جدید پدر و مادرم سر زدیم."]],"tip":"در فارسی مالک بعد از اسم می‌آید («کتابِ علی»)، در انگلیسی برعکس: Ali's book. هم‌چنین his برای مرد و her برای زن است؛ فارسی این تفاوت را ندارد («ـَش»).","d":[["This is ___ car. (I)","my","me","mine"],["Mina loves ___ job.","her","his","their"],["Reza and ___ wife live in Tabriz.","his","her","its"],["That is ___ house. (Ali)","Ali's","Ali","Alis"],["___ bag is this?","Whose","Who","Who's"],["The children are with ___ teacher.","their","they","there"],["The cat is eating ___ food.","its","it's","his"],["This is my parents' ___.","house","houses'","house's"]]},{"id":"g03","lv":"A1","t":"Plurals; this, that, these, those","fa":"جمع؛ this، that، these، those","r":[["Most nouns add -s: book → books. After s, sh, ch, x add -es: box → boxes.","بیشتر اسم‌ها با -s جمع بسته می‌شوند؛ بعد از s/sh/ch/x با -es."],["Irregular: man → men, woman → women, child → children, person → people, tooth → teeth.","جمع‌های بی‌قاعده را حفظ کنید: men, women, children, people, teeth."],["this (one, near) · these (more, near) · that (one, far) · those (more, far).","this/these برای نزدیک، that/those برای دور؛ these و those برای جمع."]],"ex":[["This coffee is hot.","این قهوه داغ است."],["These shoes are new.","این کفش‌ها نو هستند."],["That man is my uncle.","آن مرد عموی من است."],["Those children are noisy.","آن بچه‌ها پرسروصدا هستند."],["I need two boxes.","دو جعبه لازم دارم."],["Three people are waiting.","سه نفر منتظرند."]],"tip":"در فارسی بعد از عدد اسم مفرد می‌آید («سه کتاب»)، اما در انگلیسی باید جمع ببندید: three books.","d":[["I have three ___.","children","childs","child"],["___ shoes are too small.","These","This","That"],["Look at ___ bird over there!","that","these","those"],["There are two ___ on the table.","glasses","glass","glasss"],["___ is my phone, here in my hand.","This","Those","These"],["How many ___ live here?","people","peoples","person"],["Those ___ are very old.","houses","house","housees"],["I brush my ___ twice a day.","teeth","tooths","tooth"]]},{"id":"g32","lv":"A1","t":"Subject & object pronouns","fa":"ضمیرهای فاعلی و مفعولی","r":[["Subject (before the verb): I, you, he, she, it, we, they.","ضمیر فاعلی قبل از فعل: I, he, she…"],["Object (after the verb or a preposition): me, you, him, her, it, us, them.","ضمیر مفعولی بعد از فعل یا حرف اضافه: me, him, her, us, them."],["Use 'it' for things and animals, 'he/she' only for people (and pets you know).","برای اشیا it، برای انسان he یا she."]],"ex":[["I love her.","من او را دوست دارم."],["She calls me every day.","او هر روز به من زنگ می‌زند."],["Can you help us?","می‌توانی به ما کمک کنی؟"],["Where are my keys? I can't find them.","کلیدهایم کجاست؟ پیدایشان نمی‌کنم."],["This is for you.","این برای توست."],["We visit them on Fridays.","جمعه‌ها به آن‌ها سر می‌زنیم."]],"tip":"در فارسی «او» برای مرد و زن یکی است. در انگلیسی باید he یا she را انتخاب کنید؛ خطای رایج: My sister… he is ✗ → she is ✓.","d":[["Please give ___ the book.","me","I","my"],["My sister is a nurse. ___ works at night.","She","He","Her"],["I don't know ___. Who is he?","him","he","his"],["___ are from Iran.","We","Us","Our"],["Can you call ___ tomorrow?","us","we","our"],["The apples are fresh. I bought ___ today.","them","they","it"],["This letter is for ___.","her","she","hers"],["My phone? I left ___ at home.","it","him","them"]]},{"id":"g04","lv":"A1","t":"Present simple","fa":"زمان حال ساده","r":[["Use it for habits, routines and facts: I work in a bank. Water boils at 100°C.","برای عادت‌ها، کارهای روزمره و حقایق کلی."],["He/she/it adds -s: she works, he goes, it watches.","با سوم‌شخص مفرد (he/she/it) به فعل -s یا -es اضافه کنید."],["have → has, go → goes, do → does, study → studies.","شکل‌های خاص: has, goes, does, studies."]],"ex":[["I drink tea every morning.","هر روز صبح چای می‌نوشم."],["She works in a hospital.","او در بیمارستان کار می‌کند."],["My son goes to school by bus.","پسرم با اتوبوس به مدرسه می‌رود."],["The shop opens at nine.","مغازه ساعت نُه باز می‌شود."],["He has two sisters.","او دو خواهر دارد."],["They live near the park.","آن‌ها نزدیک پارک زندگی می‌کنند."],["The sun rises in the east.","خورشید از شرق طلوع می‌کند."]],"tip":"در فارسی همهٔ اشخاص شناسه دارند، ولی در انگلیسی فقط he/she/it نیاز به -s دارد؛ رایج‌ترین خطا: She work ✗ → She works ✓.","d":[["She ___ in an office.","works","work","working"],["My brother ___ football on Fridays.","plays","play","playing"],["I ___ coffee in the morning.","drink","drinks","drinking"],["The train ___ at 8:30.","leaves","leave","leaving"],["He ___ two children.","has","have","haves"],["We ___ English on Mondays.","study","studies","studys"],["My mother ___ to work by car.","goes","go","gos"],["Water ___ at 100 degrees.","boils","boil","boiling"]]},{"id":"g15","lv":"A1","t":"Adverbs of frequency & word order","fa":"قیدهای تکرار و ترتیب کلمات","r":[["English word order is Subject – Verb – Object: I drink tea (NOT I tea drink).","ترتیب جملهٔ انگلیسی: فاعل – فعل – مفعول (برخلاف فارسی که فعل آخر می‌آید)."],["Frequency adverbs go before the main verb: I always walk.","قید تکرار قبل از فعل اصلی می‌آید: I always walk."],["…but after 'be': She is never late.","ولی بعد از فعل be: She is never late."],["Time and place usually go at the end, place before time: I work in Tehran on Mondays.","قید مکان و زمان معمولاً آخر جمله؛ اول مکان، بعد زمان."]],"ex":[["I usually get up at seven.","معمولاً ساعت هفت بیدار می‌شوم."],["He is always tired.","او همیشه خسته است."],["We sometimes eat out.","گاهی بیرون غذا می‌خوریم."],["She never drinks coffee.","او هرگز قهوه نمی‌نوشد."],["I bought a jacket in town yesterday.","دیروز در شهر یک کاپشن خریدم."],["They often visit us at the weekend.","آن‌ها اغلب آخر هفته‌ها به ما سر می‌زنند."]],"tip":"فارسی فعل را آخر جمله می‌گذارد («من چای می‌نوشم»)، انگلیسی بلافاصله بعد از فاعل: I drink tea.","d":[["Choose the correct sentence:","I often play tennis.","I play often tennis.","Often I tennis play."],["Choose the correct sentence:","She is always happy.","She always is happy.","Always she happy is."],["Choose the correct sentence:","We never eat meat.","We eat never meat.","We meat never eat."],["Choose the correct sentence:","I met Sara at the café yesterday.","I met yesterday Sara at the café.","I yesterday met at the café Sara."],["Choose the correct sentence:","He usually drives to work.","He drives usually to work.","Usually he to work drives."],["Choose the correct sentence:","We hardly ever go out.","We go hardly ever out.","Hardly ever we go out."],["Choose the correct sentence:","I drink tea every morning.","I tea drink every morning.","Every morning drink I tea."],["Choose the correct sentence:","My father rarely watches TV.","My father watches rarely TV.","Rarely my father TV watches."]]},{"id":"g05","lv":"A1","t":"Questions & negatives with do/does","fa":"سؤال و منفی با do/does","r":[["Negative: don't / doesn't + base verb: I don't smoke. She doesn't eat meat.","منفی: don't یا doesn't + شکل سادهٔ فعل (بدون -s)."],["Question: Do/Does + subject + base verb: Do you speak English? Does he live here?","سؤالی: Do/Does + فاعل + فعل ساده."],["With does/doesn't, the verb loses -s: Does she work? (NOT Does she works?)","با does فعل اصلی دیگر -s نمی‌گیرد."],["Wh-questions: Where do you live? What time does it start?","با کلمات پرسشی: Where/What/When + do/does + فاعل + فعل."]],"ex":[["I don't like spicy food.","غذای تند دوست ندارم."],["He doesn't drive.","او رانندگی نمی‌کند."],["Do you have a pen?","خودکار داری؟"],["Does your sister speak English?","خواهرت انگلیسی صحبت می‌کند؟"],["Where do you work?","کجا کار می‌کنی؟"],["What time does the bank close?","بانک ساعت چند می‌بندد؟"],["We don't live in the city centre.","ما در مرکز شهر زندگی نمی‌کنیم."]],"tip":"فارسی‌زبان‌ها سؤال را فقط با لحن می‌سازند («تو انگلیسی بلدی؟»). در انگلیسی حال ساده باید do/does داشته باشد: Do you speak English?","d":[["___ you like tea?","Do","Does","Are"],["She ___ eat meat.","doesn't","don't","isn't"],["Where ___ he work?","does","do","is"],["They ___ have a car.","don't","doesn't","aren't"],["Does your father ___ English?","speak","speaks","speaking"],["What time ___ the film start?","does","do","is"],["I ___ understand the question.","don't","doesn't","not"],["___ she live near you?","Does","Do","Is"]]},{"id":"g35","lv":"A1","t":"Question words: who, what, where, when, why, how","fa":"کلمات پرسشی","r":[["who (person), what (thing), where (place), when (time), why (reason), which (choice).","who: چه کسی، what: چه، where: کجا، when: کی، why: چرا، which: کدام."],["how + adjective/adverb: how old, how much, how many, how often, how long, how far.","how + صفت: How old, How much, How often…"],["Order: question word + auxiliary + subject + verb: Where do you live?","ترتیب: کلمهٔ پرسشی + فعل کمکی + فاعل + فعل."],["When 'who/what' is the subject, no do: Who called you? What happened?","اگر who/what خودش فاعل باشد do نمی‌آید: Who called?"]],"ex":[["What's your name?","اسمت چیست؟"],["Where do you work?","کجا کار می‌کنی؟"],["How old is your son?","پسرت چند سال دارد؟"],["How often do you go to the gym?","هر چند وقت یک بار باشگاه می‌روی؟"],["Why are you sad?","چرا ناراحتی؟"],["Who lives here?","چه کسی این‌جا زندگی می‌کند؟"],["Which bus goes to the station?","کدام اتوبوس به ایستگاه می‌رود؟"]],"tip":"در فارسی کلمهٔ پرسشی وسط جمله می‌آید («تو کجا کار می‌کنی؟»)؛ در انگلیسی همیشه اول جمله: Where do you work?","d":[["___ do you live? — In Shiraz.","Where","When","Who"],["___ is your birthday? — In May.","When","Where","What"],["___ old are you?","How","What","Which"],["___ money do you need?","How much","How many","How often"],["___ is that man? — My uncle.","Who","Where","Why"],["___ are you late? — The bus was slow.","Why","What","How"],["Choose the correct question:","What time does the film start?","What time the film starts?","What time starts the film does?"],["Who ___ the window?","broke","did broke","does broke"]]},{"id":"g06","lv":"A1","t":"have / has got","fa":"have و has got (داشتن)","r":[["have/has = possess: I have a car. She has a cat.","have/has به معنی داشتن (مالکیت، خانواده، بیماری)."],["British English often uses have got: I've got a cold. Has he got a car?","در انگلیسی بریتانیایی have got هم رایج است: I've got a cold."],["Negative/question with have: I don't have… / Do you have…? With have got: I haven't got… / Have you got…?","منفی و سؤالی: don't have / Do you have یا haven't got / Have you got."]],"ex":[["I have two brothers.","دو برادر دارم."],["She's got long hair.","موهای بلندی دارد."],["Do you have any questions?","سؤالی دارید؟"],["We haven't got time.","وقت نداریم."],["He has a headache.","سردرد دارد."],["Have you got a pen?","خودکار داری؟"]],"tip":"«داشتن» در فارسی برای استمرار هم به کار می‌رود («دارم می‌روم»)، اما have این معنا را ندارد؛ برای آن از am going استفاده کنید.","d":[["She ___ a new phone.","has","have","is"],["___ you got a car?","Have","Has","Do"],["I ___ have any brothers.","don't","haven't","doesn't"],["He's ___ a cold.","got","get","have"],["They ___ a big garden.","have","has","having"],["___ she have a job?","Does","Do","Has"],["We haven't ___ much money.","got","get","have"],["My flat ___ two bedrooms.","has","have","got"]]},{"id":"g07","lv":"A1","t":"There is / there are + prepositions of place","fa":"There is / there are و حروف اضافهٔ مکان","r":[["there is + singular/uncountable; there are + plural.","there is برای مفرد و غیرقابل‌شمارش، there are برای جمع."],["Negative: there isn't / there aren't any. Question: Is there…? Are there any…?","منفی: there isn't / aren't any. سؤال: Is there…? / Are there any…?"],["Place: in (inside), on (surface), under, next to, between, behind, in front of, opposite.","in داخل، on روی، under زیر، next to کنار، between بین، behind پشت، in front of جلوی، opposite روبه‌رو."]],"ex":[["There's a bank on the corner.","سر نبش یک بانک هست."],["There are three chairs in the kitchen.","در آشپزخانه سه صندلی هست."],["Is there a pharmacy near here?","این نزدیکی داروخانه هست؟"],["There isn't any milk in the fridge.","در یخچال شیر نیست."],["The cat is under the table.","گربه زیر میز است."],["The bank is between the café and the school.","بانک بین کافه و مدرسه است."],["Your keys are on the shelf.","کلیدهایت روی قفسه است."]],"tip":"«در» فارسی هم برای in و هم برای on به کار می‌رود؛ دقت کنید: on the table (روی سطح)، in the box (داخل).","d":[["There ___ a park near my house.","is","are","be"],["There ___ two banks in this street.","are","is","has"],["___ there any eggs?","Are","Is","Do"],["The book is ___ the table.","on","in","at"],["The keys are ___ my bag.","in","on","at"],["There isn't ___ sugar.","any","some","a"],["The café is ___ the bank and the school.","between","next","opposite to"],["The car is ___ front of the house.","in","on","at"]]},{"id":"g33","lv":"A1","t":"Prepositions of time: in, on, at","fa":"حروف اضافهٔ زمان: in، on، at","r":[["at + clock times
