<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">

<title>English — A1 to C1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#070B16; --bg2:#0D1530; --panel:rgba(22,32,58,.78); --panel2:#1B2744; --panel3:#253556;
  --line:rgba(125,150,210,.16); --line2:rgba(125,150,210,.34);
  --tx:#EEF2FA; --dim:#97A7C7; --dim2:#6A7CA0;
  --gold:#FFC24A; --gold2:#FF8A4C; --blue:#5B8DEF; --blue-d:#152647;
  --mint:#34D399; --mint-d:#0E2E27; --coral:#FF6B6B; --coral-d:#36161C; --violet:#A78BFA;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --fa:"Vazirmatn","Geeza Pro","Damascus","Tahoma",-apple-system,system-ui,sans-serif;
  --r:20px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --grad:linear-gradient(135deg,#FFC24A,#FF7A45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 40% at 12% 0%,rgba(255,176,32,.15),transparent 60%),
  radial-gradient(50% 35% at 92% 8%,rgba(91,141,239,.2),transparent 60%),
  radial-gradient(45% 35% at 60% 100%,rgba(167,139,250,.12),transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg) 60%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.fa{font-family:var(--fa);direction:rtl;unicode-bidi:isolate;text-align:right}
.fa.c,.c .fa{text-align:center}
#app,#gate,#run{position:relative;z-index:1}
#gate{display:none;min-height:100vh;flex-direction:column;justify-content:center;padding:calc(30px + var(--sat)) 22px calc(30px + var(--sab));max-width:520px;margin:0 auto}
#app{display:none;max-width:560px;margin:0 auto;padding:calc(14px + var(--sat)) 16px calc(110px + var(--sab))}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.h2{font-size:20px;font-weight:750;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:700}
.sm{font-size:14px;color:var(--dim)}
.xs{font-size:12px;color:var(--dim2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card.tap{display:block;width:100%;text-align:left;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.glow{box-shadow:0 0 0 1px rgba(255,194,74,.35),0 12px 40px rgba(255,138,76,.18)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.sec{margin:22px 4px 6px}
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;background:var(--grad);color:#1B1206;font-weight:800;font-size:16px;text-align:center;box-shadow:0 8px 24px rgba(255,138,76,.28)}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;border:1px solid var(--line2);color:var(--tx);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--tx);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn.inl{display:inline-block;width:auto}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;background:rgba(255,255,255,.08);color:var(--dim)}
.chip.gold{background:rgba(255,194,74,.16);color:var(--gold)}
.chip.mint{background:var(--mint-d);color:var(--mint)}
.chip.blue{background:var(--blue-d);color:#9DBBFF}
.lv-A1{--lc:#34D399}.lv-A2{--lc:#5EEAD4}.lv-B1{--lc:#5B8DEF}.lv-B2{--lc:#A78BFA}.lv-C1{--lc:#FFC24A}
.lvchip{display:inline-block;min-width:34px;text-align:center;padding:3px 8px;border-radius:9px;font-size:11px;font-weight:900;color:var(--lc);background:color-mix(in srgb,var(--lc) 16%,transparent)}
.typebox{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.25);outline:none;font-size:17px;text-align:center}
.typebox:focus{border-color:var(--gold)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.av{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--grad);color:#1B1206;font-weight:900;font-size:18px;flex:none}
.who{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);margin:8px 0;text-align:left}
.icob{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);font-size:17px;flex:none}
.icob:active{transform:scale(.92)}
.say{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(91,141,239,.18);color:#BFD2FF;font-size:15px;flex:none}
.say.big{width:64px;height:64px;font-size:26px;background:var(--grad);color:#1B1206;box-shadow:0 10px 30px rgba(255,138,76,.35)}
/* tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));z-index:5;display:flex;gap:2px;padding:6px;border-radius:24px;background:rgba(14,22,42,.86);border:1px solid var(--line2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.45);width:min(540px,calc(100% - 20px))}
#tabs button{flex:1;padding:7px 2px 6px;border-radius:18px;font-size:10.5px;font-weight:700;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px}
#tabs button b{font-size:20px;line-height:1.1;font-weight:400}
#tabs button.on{background:rgba(255,194,74,.14);color:var(--gold)}
/* run overlay */
#run{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column}
#run::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 50% 0%,rgba(91,141,239,.18),transparent 60%),radial-gradient(60% 40% at 50% 100%,rgba(255,176,32,.10),transparent 60%)}
.runtop{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 8px}
.runbody{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(24px + var(--sab));max-width:560px;width:100%;margin:0 auto}
.runbar{flex:1}
.opt{display:block;width:100%;padding:15px 16px;margin:9px 0;border-radius:16px;background:var(--panel);border:1px solid var(--line2);font-size:17px;font-weight:600;text-align:center;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--mint-d);border-color:var(--mint);color:#B6F5DA}
.opt.bad{background:var(--coral-d);border-color:var(--coral);color:#FFC2C2}
.opt.fa{font-size:18px;text-align:center}
.prompt{text-align:center;margin:18px 0 8px}
.prompt .w{font-size:34px;font-weight:850;letter-spacing:-.02em}
.prompt .fa{font-size:26px;text-align:center}
.feedback{margin-top:12px;padding:14px;border-radius:16px;font-size:15px}
.feedback.ok{background:var(--mint-d);color:#B6F5DA}
.feedback.bad{background:var(--coral-d);color:#FFC9C9}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--gold);color:var(--gold)}
/* 3D picture stage */
.stage{perspective:700px;display:flex;justify-content:center;margin:8px 0 4px;touch-action:none}
.pic3d{width:150px;height:150px;border-radius:38px;display:flex;align-items:center;justify-content:center;font-size:92px;
  background:radial-gradient(120% 120% at 30% 20%,rgba(255,255,255,.18),rgba(255,255,255,.02) 55%),linear-gradient(160deg,var(--panel3),#101a33);
  border:1px solid var(--line2);box-shadow:0 30px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
  transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-10deg));transform-style:preserve-3d;animation:float3d 5s ease-in-out infinite}
.pic3d span{display:block;transform:translateZ(38px);filter:drop-shadow(0 14px 12px rgba(0,0,0,.45))}
.pic3d.tile{font-size:64px;font-weight:900;color:#1B1206;background:var(--grad)}
@keyframes float3d{0%,100%{translate:0 0}50%{translate:0 -8px}}
.mini{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(160deg,var(--panel3),#101a33);border:1px solid var(--line);font-size:24px;flex:none}
.mini.tile{background:rgba(255,194,74,.12);color:var(--gold);font-weight:900;font-size:17px}
.syn{display:inline-block;margin:3px 4px 0 0;padding:3px 10px;border-radius:999px;background:var(--blue-d);color:#B5CBFF;font-size:13px;font-weight:600}
.ex{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.ex .en{font-size:16px;font-weight:600}
.ex .fa{font-size:15px;color:var(--dim);margin-top:4px}
.dl{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.dl.r{flex-direction:row-reverse}
.bub{max-width:82%;padding:10px 13px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}
.dl.r .bub{background:rgba(91,141,239,.16);border-color:rgba(91,141,239,.35)}
.bub.now{box-shadow:0 0 0 2px var(--gold)}
.bub .fa{font-size:14px;color:var(--dim);margin-top:4px}
.spk{font-size:11px;font-weight:800;color:var(--dim2);margin-bottom:2px}
.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:50;padding:11px 18px;border-radius:14px;background:#222F4D;border:1px solid var(--line2);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90%;text-align:center}
.update{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sab));z-index:30;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:18px;background:#1F2C4C;border:1px solid var(--gold);font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.45);white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13px;font-weight:700;color:var(--dim)}
.seg button.on{background:rgba(255,194,74,.16);color:var(--gold)}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.ring{width:58px;height:58px;flex:none}
.stat{flex:1;text-align:center;padding:12px 6px;border-radius:16px;background:rgba(0,0,0,.2)}
.stat b{display:block;font-size:22px}
.road{position:relative;padding-left:22px}
.road::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--mint),var(--blue),var(--violet),var(--gold))}
.road .card{position:relative}
.road .card::before{content:"";position:absolute;left:-20px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 4px var(--bg)}
.done-mark{color:var(--mint);font-weight:900}
.hide{display:none!important}
.rule{padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(255,194,74,.1);border:1px solid rgba(255,194,74,.3)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pairs button{padding:12px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);font-weight:700}

</style>
</head>

 am / is / are","r":[["I am · you/we/they are · he/she/it is.","I با am، با you/we/they فعل are، و با he/she/it فعل is می‌آید."],["Short forms: I'm, you're, he's, she's, it's, we're, they're.","در گفتار معمولاً شکل کوتاه به کار می‌رود: I'm, he's, they're."],["Negative: add not → I'm not, he isn't, they aren't.","منفی: not اضافه کنید ← I'm not, he isn't, they aren't."],["Question: put the verb first → Are you tired? Is she here?","سؤالی: فعل را به اول جمله بیاورید ← Are you tired?"]],"ex":[["I'm a student.","من دانشجو هستم."],["She's from Tabriz.","او اهل تبریز است."],["We aren't late.","ما دیر نکرده‌ایم."],["Are they your parents?","آن‌ها پدر و مادرت هستند؟"],["It isn't expensive.","گران نیست."],["Is your brother married?","برادرت ازدواج کرده؟"],["You're right.","حق با توست."]],"tip":"در فارسی گاهی فعل «است» حذف می‌شود («من خسته»)، اما در انگلیسی جملهٔ بدون فعل غلط است: I am tired، نه I tired.","d":[["She ___ a doctor.","is","are","am"],["I ___ from Iran.","am","is","are"],["They ___ at home.","are","is","am"],["___ you hungry?","Are","Is","Am"],["He ___ not my teacher.","is","are","am"],["We ___ friends.","are","is","be"],["It ___ cold today.","is","are","am"],["My parents ___ in Shiraz.","are","is","am"]]},{"id":"g02","lv":"A1","t":"Articles: a, an, the","fa":"حروف تعریف: a، an، the","r":[["Use a/an with one thing mentioned for the first time: a book, an apple.","a/an برای یک چیزِ نامعین یا اولین بار ذکرشده: a book."],["Use an before a vowel SOUND: an hour, an egg, but a university.","an قبل از صدای مصوت: an hour (h تلفظ نمی‌شود)، ولی a university (با صدای «یو»)."],["Use the when both people know which one: the sun, the door, the book I bought.","the وقتی هر دو طرف می‌دانند منظور کدام است: the sun."],["Jobs need a/an: She's a nurse. No article for general plurals: I like cats.","قبل از شغل a/an لازم است: She's a nurse. برای جمع کلی حرف تعریف نمی‌آید: I like cats."]],"ex":[["I have a car. The car is red.","یک ماشین دارم. ماشین قرمز است."],["She's an engineer.","او ","These"],["How many ___ live here?","people","peoples","person"],["Those ___ are very old.","houses","house","housees"],["I brush my ___ twice a day.","teeth","tooths","tooth"]]},{"id":"g04","lv":"A1","t":"Present simple","fa":"زمان حال ساده","r":[["Use it for habits, routines and facts: I work in a bank. Water boils at 100°C.","برای عادت‌ها، کارهای روزمره و حقایق کلی."],["He/she/it adds -s: she works, he goes, it watches.","با سوم‌شخص مفرد (he/she/it) به فعل -s یا -es اضافه کنید."],["have → has, go → goes, do → does, study → studies.","شکل‌های خاص: has, goes, does, studies."]],"ex":[["I drink tea every morning.","هر روز صبح چای می‌نوشم."],["She works in a hospital.","او در بیمارستان کار می‌کند."],["My son goes to school by bus.","پسرم با اتوبوس به مدرسه می‌رود."],["The shop opens at nine.","مغازه ساعت نُه باز می‌شود."],["He has two sisters.","او دو خواهر دارد."],["They live near the park.","آن‌ها نزدیک پارک زندگی می‌کنند."],["The sun rises in the east.","خورشید از شرق طلوع می‌کند."]],"tip":"در فارسی همهٔ اشخاص شناسه دارند، ولی در انگلیسی فقط he/she/it نیاز به -s دارد؛ رایج‌ترین خطا: She work ✗ → She works ✓.","d":[["She ___ in an office.","works","work","working"],["My brother ___ football on Fridays.","plays","play","playing"],["I ___ coffee in the morning.","drink","drinks","drinking"],["The train ___ at 8:30.","leaves","leave","leaving"],["He ___ two children.","has","have","haves"],["We ___ English on Mondays.","study","studies","studys"],["My mother ___ to work by car.","goes","go","gos"],["Water ___ at 100 degrees.","boils","boil","boiling"]]},{"id":"g05","lv":"A1","t":"Questions & negatives with do/does","fa":"سؤال و منفی با do/does","r":[["Negative: don't / doesn't + base verb: I don't smoke. She doesn't eat meat.","منفی: don't یا doesn't + شکل سادهٔ فعل (بدون -s)."],["Question: Do/Does + subject + base verb: Do you speak English? Does he live here?","سؤالی: Do/Does + فاعل + فعل ساده."],["With does/doesn't, the verb loses -s: Does she work? (NOT Does she "fa":"can / can't (توانایی، اجازه، درخواست)","r":[["can + base verb for all persons: I/she/they can swim. (no -s, no to)","can + فعل ساده برای همهٔ اشخاص؛ بدون -s و بدون to."],["Negative: can't (cannot). Question: Can you…?","منفی: can't. سؤال: Can you…?"],["Polite request: Can I / Could I…? Could you…?","درخواست مؤدبانه: Could you…? مؤدبانه‌تر از Can you…? است."]],"ex":[["I can speak three languages.","می‌توانم به سه زبان صحبت کنم."],["She can't drive.","او نمی‌تواند رانندگی کند."],["Can I sit here?","می‌توانم این‌جا بنشینم؟"],["Could you help me, please?","ممکن است لطفاً کمکم کنید؟"],["Can you hear me?","صدایم را می‌شنوی؟"],["We can't come tomorrow.","فردا نمی‌توانیم بیاییم."]],"tip":"بعد از can هرگز to نیاورید: I can to swim ✗ → I can swim ✓.","d":[["She can ___ the piano.","play","plays","to play"],["___ you help me?","Can","Do","Are"],["I ___ swim. I never learned.","can't","don't","not can"],["He can ___ French very well.","speak","speaks","speaking"],["___ I open the window?","Can","Do","Am"],["___ you pass the salt, please? (polite)","Could","Do","Are"],["They can't ___ today.","come","to come","coming"],["My son can ___ to ten.","count","counts","counting"]]},{"id":"g09","lv":"A2","t":"Present continuous vs present simple","fa":"حال استمراری در برابر حال ساده","r":[["Present continuous (am/is/are + -ing) = now or around now: I'm reading.","حال استمراری برای کاری که الان یا این روزها در جریان است."],["Present simple = habits and facts: I read every night.","حال ساده برای عادت و حقیقت."],["Signal words: now, at the moment, today (continuous) · always, usually, every day (simple).","نشانه‌ها: now, at the moment ← استمراری؛ always, every day ← ساده."],["State verbs are rarely continuous: know, like, want, need, believe. I want (NOT I'm wanting).","افعال حالتی مثل know, like, want معمولاً استمراری نمی‌شوند."]],"ex":[["I'm cooking dinner right now.","الان دارم شام درست می‌کنم."],["I cook dinner every evening.","هر شب شام درست می‌کنم."],["She's working from home this week.","این هفته از خانه کار می‌کند."],["He usually takes the bus.","او معمولاً با اتوبوس می‌رود."],["Look! It's snowing.","نگاه کن! دارد برف می‌آید."],["I know the answer.","جواب را می‌دانم."],["What are you doing?","داری چه کار می‌کنی؟"]],"tip":"در فارسی «می‌خورم» هم برای عادت و هم برای الان است. در انگلیسی برای «الان دارم...» حتماً am/is/are + ing بگویید.","d":[["Be quiet! The baby ___.","is sleeping","sleeps","sleep"],["I ___ to the gym every Monday.","go","am going","goes"],["What ___ you doing now?","are","do","is"],["She ___ the answer.","knows","is knowing","know"],["Look, it ___!","is raining","rains","rain"],["He usually ___ tea.","drinks","is drinking","drink"],["We ___ a new house at the moment.","are building","build","builds"],["I ___ a coffee, please.","want","am wanting","wants"]]},{"id":"g10","lv":"A2","t":"Past simple: regular verbs & 'was/were'","fa":"گذشتهٔ ساده: افعال باقاعده و was/were","r":[["Regular verbs add -ed: work → worked, live → lived, study → studied, stop → stopped.","افعال باقاعده با -ed گذشته می‌شوند (توجه به تغییر املایی)."],["was (I/he/she/it) · were (you/we/they).","was برای I/he/she/it، were برای you/we/they."],["Negative/question: didn't + base verb; Did you…? (I didn't work. Did she call?)","منفی و سؤالی با did: didn't + فعل ساده، Did + فاعل + فعل ساده."],["Pronounce -ed as /t/ (worked), /d/ (lived) or /ɪd/ (wanted, needed).","-ed سه تلفظ دارد: /t/، /d/ و /ɪd/ (فقط بعد از t و d)."]],"ex":[["I worked late yesterday.","دیروز تا دیر وقت کار کردم."],["We were in Istanbul last summer.","تابستان گذشته در استانبول بودیم."],["She didn't call me.","به من زنگ نزد."],["Did you watch the match?","مسابقه را دیدی؟"],["They lived in Mashhad for ten years.","ده سال در مشهد زندگی کردند."],["The film was boring.","فیلم خسته‌کننده بود."],["I wanted to stay at home.","می‌خواستم در خانه بمانم."]],"tip":"«worked» را «ورکِد» تلفظ نکنید؛ درست: /wɜːkt/. فقط بعد از t و d صدای «اِد» دارد: wanted.","d":[["I ___ TV last night.","watched","watch","watching"],["They ___ at home yesterday.","were","was","are"],["She didn't ___ the email.","answer","answered","answers"],["___ you visit your parents?","Did","Do","Were"],["The weather ___ terrible.","was","were","is"],["We ___ English for two years.","studied","studyed","study"],["He ___ the bus this morning.","missed","miss","misses"],["___ the shop open on Sunday?","Was","Did","Were"]]},{"id":"g11","lv":"A2","t":"Past simple: irregular verbs","fa":"گذشتهٔ ساده: افعال بی‌قاعده","r":[["Many common verbs are irregular: go → went, have → had, make → made, see → saw, buy → bought.","بسیاری از افعال پرکاربرد بی‌قاعده‌اند و باید حفظ شوند."],["Only the positive form is irregular. With didn't/did, use the base verb: I didn't go. Did you see it?","فقط جملهٔ مثبت بی‌قاعده است؛ با did/didn't شکل ساده می‌آید."],["Learn them in groups: bought/brought/thought/taught; took/shook; wrote/drove/rode.","گروهی حفظ کنید: bought/brought/thought/taught."]],"ex":[["We went to the beach.","به ساحل رفتیم."],["I bought a new phone.","یک گوشی نو خریدم."],["She told me the truth.","حقیقت را به من گفت."],["Did you see my keys?","کلیدهایم را دیدی؟"],["He didn't come to the party.","به مهمانی نیامد."],["They took a taxi.","تاکسی گرفتند."],["I forgot my password.","رمزم را فراموش کردم."]],"tip":"خطای رایج: Did you went? ✗ → Did you go? ✓ (بعد از did فعل گذشته نمی‌آید).","d":[["I ___ to London last year.","went","goed","go"],["She ___ a cake for my birthday.","made","maked","make"],["Did you ___ the news?","hear","heard","hears"],["We ___ dinner at nine.","had","haved","have"],["He ___ me a message.","sent","sended","send"],["They didn't ___ anything.","buy","bought","buys"],["I ___ my wallet at home.","left","leaved","leave"],["She ___ a letter to her friend.","wrote","writed","write"]]},{"id":"g12","lv":"A2","t":"Countable & uncountable: some, any, much, many","fa":"اسم‌های قابل‌شمارش و غیرقابل‌شمارش","r":[["Countable nouns have plurals (apples). Uncountable don't (water, money, advice, information, luggage).","قابل‌شمارش‌ها جمع دارند؛ غیرقابل‌شمارش‌ها مثل water, advice, information جمع بسته نمی‌شوند."],["some in positive sentences; any in negatives and questions: I have some time. Have you got any milk?","some در جملهٔ مثبت؛ any در منفی و سؤالی (در تعارف some: Would you like some tea?)."],["many + countable, much + uncountable (mainly negatives/questions); a lot of for both.","many برای قابل‌شمارش، much برای غیرقابل‌شمارش؛ a lot of برای هر دو."]],"ex":[["There's some bread on the table.","مقداری نان روی میز است."],["I don't have any money.","هیچ پولی ندارم."],["How many children do you have?","چند تا بچه دارید؟"],["How much is it?","چند است؟"],["She gave me some good advice.","چند نصیحت خوب به من کرد."],["We have a lot of homework.","تکلیف زیادی داریم."],["Would you like some tea?","چای میل دارید؟"]],"tip":"advice, information, furniture, news در فارسی شمردنی‌اند ولی در انگلیسی نه: an advice ✗ → a piece of advice ✓.","d":[["How ___ apples do you want?","many","much","any"],["I don't have ___ time today.","much","many","some"],["Is there ___ milk?","any","many","a"],["Can you give me some ___?","advice","advices","an advice"],["There are ___ people here.","a lot of","much","any"],["How ___ does it cost?","much","many","lot"],["Would you like ___ cake?","some","any","many"],["The ___ is good today.","news","newses","new"]]},{"id":"g13","lv":"A2","t":"Comparatives & superlatives","fa":"صفت تفضیلی و عالی","r":[["Short adjectives: -er / the -est: cheap → cheaper → the cheapest; big → bigger → the biggest.","صفات کوتاه: -er و the -est (با دو برابر شدن حرف آخر در big)."],["Long adjectives: more / the most: expensive → more expensive → the most expensive.","صفات بلند: more و the most."],["Irregular: good → better → the best; bad → worse → the worst; far → further.","بی‌قاعده: better/best، worse/worst."],["Compare with than: Tehran is bigger than Shiraz. Equal: as … as.","مقایسه با than؛ برابری با as … as."]],"ex":[["My flat is smaller than yours.","آپارتمان من از مال تو کوچک‌تر است."],["This is the most beautiful city in Iran.","این زیباترین شهر ایران است."],["Today is hotter than yesterday.","امروز از دیروز گرم‌تر است."],["She's the best student in the class.","او بهترین دانشجوی کلاس است."],["The train is more comfortable than the bus.","قطار از اتوبوس راحت‌تر است."],["He's as tall as his father.","هم‌قد پدرش است."],["That was the worst film I've ever seen.","آن بدترین فیلمی بود که تا حالا دیده‌ام."]],"tip":"در فارسی «از» قبل از مقایسه می‌آید؛ در انگلیسی than بعد از صفت: bigger than (نه more big from).","d":[["This bag is ___ than that one.","cheaper","more cheap","cheapest"],["She's the ___ person I know.","kindest","kinder","most kind"],["Gold is ___ than silver.","more expensive","expensiver","most expensive"],["My English is ___ than last year.","better","gooder","best"],["It's the ___ day of the year.","hottest","hotter","most hot"],["He is as old ___ me.","as","than","like"],["Today's weather is ___ than yesterday's.","worse","badder","worst"],["Russia is the ___ country in the world.","biggest","bigger","most big"]]},{"id":"g14","lv":"A2","t":"Future: going to & will","fa":"آینده: going to و will","r":[["be going to = a plan already decided: I'm going to visit my aunt.","going to برای برنامه‌ای که از قبل تصمیمش گرفته شده."],["will = a decision now, a promise, an offer or a prediction: I'll help you. It will rain.","will برای تصمیم لحظه‌ای، قول، پیشنهاد کمک و پیش‌بینی."],["going to for predictions with present evidence: Look at those clouds — it's going to rain.","وقتی شواهدی الان دیده می‌شود: Look… it's going to rain."],["Present continuous for fixed arrangements: I'm meeting Ali at six.","قرارهای قطعی با حال استمراری: I'm meeting Ali at six."]],"ex":[["I'm going to study medicine.","قرار است پزشکی بخوانم."],["The phone's ringing. I'll answer it.","تلفن زنگ می‌زند. من جواب می‌دهم."],["I'll call you tomorrow, I promise.","قول می‌دهم فردا زنگ بزنم."],["Be careful! You're going to fall!","مواظب باش! الان می‌افتی!"],["I think prices will go up.","فکر می‌کنم قیمت‌ها بالا می‌رود."],["We're flying to Shiraz on Friday.","جمعه به شیراز پرواز می‌کنیم."]],"tip":"در فارسی برای آینده اغلب حال ساده می‌گوییم («فردا می‌روم»). در انگلیسی I go tomorrow معمولاً غلط است؛ بگویید I'm going tomorrow یا I'll go.","d":[["Look at the sky! It ___ rain.","is going to","will","goes to"],["A: I'm cold. B: I ___ close the window.","'ll","am going to","close"],["We ___ visit Isfahan next summer. We've booked the hotel.","are going to","will","visit"],["I promise I ___ be late.","won't","am not going to","don't"],["I think she ___ win.","will","is going","wins"],["What ___ you going to do this weekend?","are","will","do"],["I ___ meeting my boss at 3 p.m.","am","will","going"],["Don't worry, I ___ help you.","'ll","am going","going to"]]},{"id":"g15","lv":"A2","t":"Adverbs of frequency & word order","fa":"قیدهای تکرار و ترتیب کلمات","r":[["English word order is Subject – Verb – Object: I drink tea (NOT I tea drink).","ترتیب جملهٔ انگلیسی: فاعل – فعل – مفعول (برخلاف فارسی که فعل آخر می‌آید)."],["Frequency adverbs go before the main verb: I always walk.","قید تکرار قبل از فعل اصلی می‌آید: I always walk."],["…but after 'be': She is never late.","ولی بعد از فعل be: She is never late."],["Time and place usually go at the end, place before time: I work in Tehran on Mondays.","قید مکان و زمان معمولاً آخر جمله؛ اول مکان، بعد زمان."]],"ex":[["I usually get up at seven.","معمولاً ساعت هفت بیدار می‌شوم."],["He is always tired.","او همیشه خسته است."],["We sometimes eat out.","گاهی بیرون غذا می‌خوریم."],["She never drinks coffee.","او هرگز قهوه نمی‌نوشد."],["I bought a jacket in town yesterday.","دیروز در شهر یک کاپشن خریدم."],["They often visit us at the weekend.","آن‌ها اغلب آخر هفته‌ها به ما سر می‌زنند."]],"tip":"فارسی فعل را آخر جمله می‌گذارد («من چای می‌نوشم»)، انگلیسی بلافاصله بعد از فاعل: I drink tea.","d":[["Choose the correct sentence:","I often play tennis.","I play often tennis.","Often I tennis play."],["Choose the correct sentence:","She is always happy.","She always is happy.","Always she happy is."],["Choose the correct sentence:","We never eat meat.","We eat never meat.","We meat never eat."],["Choose the correct sentence:","I met Sara at the café yesterday.","I met yesterday Sara at the café.","I yesterday met at the café Sara."],["Choose the correct sentence:","He usually drives to work.","He drives usually to work.","Usually he to work drives."],["Choose the correct sentence:","We hardly ever go out.","We go hardly ever out.","Hardly ever we go out."],["Choose the correct sentence:","I drink tea every morning.","I tea drink every morning.","Every morning drink I tea."],["Choose the correct sentence:","My father rarely watches TV.","My father watches rarely TV.","Rarely my father TV watches."]]},{"id":"g16","lv":"B1","t":"Present perfect: ever, never, just, already, yet","fa":"حال کامل: ever، never، just، already، yet","r":[["have/has + past participle: I have finished. She has gone.","have/has + قسمت سوم فعل."],["Use it for life experience (time not stated): Have you ever been to Japan?","برای تجربه‌های زندگی بدون ذکر زمان دقیق."],["just = a moment ago; already = sooner than expected; yet = until now (questions/negatives, at the end).","just یعنی همین الان؛ already یعنی زودتر از انتظار؛ yet در سؤال و منفی، آخر جمله."],["Results now: I've lost my keys (= I don't have them now).","برای نتیجه‌ای که الان اهمیت دارد."]],"ex":[["Have you ever eaten sushi?","تا حالا سوشی خورده‌ای؟"],["I've never been to Canada.","هیچ‌وقت کانادا نرفته‌ام."],["She's just left.","همین الان رفت."],["We've already booked the tickets.","بلیت‌ها را قبلاً رزرو کرده‌ایم."],["Have you finished yet?","تمامش کردی؟"],["I haven't decided yet.","هنوز تصمیم نگرفته‌ام."],["He's lost his wallet.","کیف پولش را گم کرده."]],"tip":"«گذشتهٔ نقلی» فارسی شبیه حال کامل است، اما اگر زمان مشخص گذشته بیاید (yesterday، in 2020) باید از گذشتهٔ ساده استفاده کنید.","d":[["Have you ever ___ to Paris?","been","went","go"],["I've ___ finished my homework.","just","yet","ever"],["She hasn't called ___.","yet","already","just"],["We've ___ seen this film. Let's watch another.","already","yet","ever"],["He ___ lost his phone.","has","have","is"],["I've never ___ a horse.","ridden","rode","ride"],["Have they arrived ___?","yet","already","never"],["___ you ever met a famous person?","Have","Did","Has"]]},{"id":"g17","lv":"B1","t":"Present perfect vs past simple; for & since","fa":"حال کامل در برابر گذشتهٔ ساده؛ for و since","r":[["Past simple = finished time: I saw him yesterday / in 2019 / last week.","گذشتهٔ ساده با زمان تمام‌شده: yesterday, last week, in 2019."],["Present perfect = unfinished time or no time: I've seen him today / this week.","حال کامل برای زمان تمام‌نشده یا بدون زمان: today, this week."],["for + a period (for three years); since + a starting point (since 2020, since Monday).","for + مدت زمان؛ since + نقطهٔ شروع."],["How long have you lived here? — I've lived here for five years.","How long برای پرسیدن مدت با حال کامل."]],"ex":[["I've lived in London for six years.","شش سال است که در لندن زندگی می‌کنم."],["She's worked here since 2021.","از سال ۲۰۲۱ این‌جا کار می‌کند."],["We moved here in 2019.","سال ۲۰۱۹ به این‌جا آمدیم."],["How long have you known Ali?","چند وقت است علی را می‌شناسی؟"],["I haven't seen her since Monday.","از دوشنبه او را ندیده‌ام."],["I saw her last Monday.","دوشنبهٔ گذشته او را دیدم."],["Have you had lunch today?","امروز ناهار خورده‌ای؟"]],"tip":"«شش سال است که این‌جا زندگی می‌کنم» را با حال ساده نگویید (I live here for six years ✗)؛ درست: I've lived here for six years.","d":[["I ___ here since 2018.","have lived","live","lived"],["She went to Spain ___.","last year","for a year","since last year"],["We've known each other ___ ten years.","for","since","from"],["He's been ill ___ Friday.","since","for","from"],["I ___ him yesterday.","saw","have seen","see"],["How long ___ you had this car?","have","did","do"],["They ___ married in 2015.","got","have got","get"],["I ___ my keys. I can't find them.","have lost","lost","lose"]]},{"id":"g18","lv":"B1","t":"First & second conditionals","fa":"جملات شرطی نوع اول و دوم","r":[["First conditional (real future): If + present, will + verb. If it rains, I'll stay home.","شرطی نوع اول (احتمال واقعی): If + حال ساده، will + فعل."],["Second conditional (imaginary/unlikely): If + past, would + verb. If I had money, I'd travel.","شرطی نوع دوم (فرضی یا نامحتمل): If + گذشته، would + فعل."],["Use were for all persons in formal style: If I were you, I'd accept.","در نوع دوم برای همهٔ اشخاص were رایج است: If I were you."],["Never use will in the if-clause: If it will rain ✗.","هرگز will را بعد از if نیاورید."]],"ex":[["If you study, you'll pass.","اگر درس بخوانی، قبول می‌شوی."],["If I see her, I'll tell her.","اگر ببینمش، به او می‌گویم."],["If I won the lottery, I'd buy a house.","اگر لاتاری می‌بردم، خانه می‌خریدم."],["If I were you, I wouldn't do that.","من جای تو بودم آن کار را نمی‌کردم."],["What would you do if you lost your job?","اگر کارت را از دست می‌دادی چه می‌کردی؟"],["If we leave now, we won't miss the train.","اگر الان راه بیفتیم، قطار را از دست نمی‌دهیم."]],"tip":"در فارسی بعد از «اگر» گاهی آینده می‌گوییم؛ در انگلیسی بعد از if، will نیاورید: If it rains (نه If it will rain).","d":[["If it ___ tomorrow, we'll stay home.","rains","will rain","rained"],["If I ___ rich, I'd travel the world.","were","am","will be"],["If you heat ice, it ___.","melts","would melt","melted"],["I ___ help you if I had time.","would","will","am"],["If she calls, I ___ you.","'ll tell","told","would told"],["If I were you, I ___ apply.","would","will","am"],["What would you do if you ___ a million dollars?","had","have","will have"],["We'll be late if we ___ hurry.","don't","won't","didn't"]]},{"id":"g19","lv":"B1","t":"Obligation & advice: must, have to, should","fa":"اجبار و توصیه: must، have to، should","r":[["must = strong obligation, often from the speaker: I must call my mum.","must اجبار قوی، معمولاً از طرف خود گوینده یا قوانین نوشته‌شده."],["have to = obligation from outside rules: I have to wear a uniform.","have to اجبار بیرونی (قانون، شرایط)."],["mustn't = it is forbidden · don't have to = it is not necessary.","mustn't یعنی ممنوع؛ don't have to یعنی لازم نیست. تفاوت مهمی دارند!"],["should = advice: You should see a doctor.","should برای توصیه و نصیحت."]],"ex":[["You must wear a seatbelt.","باید کمربند ایمنی ببندی."],["I have to work on Saturday.","شنبه باید کار کنم."],["You mustn't smoke here.","این‌جا سیگار کشیدن ممنوع است."],["You don't have to come if you're busy.","اگر سرت شلوغ است لازم نیست بیایی."],["You should drink more water.","بهتر است آب بیشتری بنوشی."],["Did you have to pay for parking?","مجبور شدی پول پارکینگ بدهی؟"],["We had to wait an hour.","مجبور شدیم یک ساعت صبر کنیم."]],"tip":"«نباید» فارسی دو معنی دارد: mustn't (ممنوع) و don't have to (لازم نیست). You don't have to pay یعنی پرداخت لازم نیست، نه ممنوع است.","d":[["You ___ park here. It's illegal.","mustn't","don't have to","shouldn't to"],["It's free. You ___ pay.","don't have to","mustn't","must"],["You look tired. You ___ go to bed.","should","must to","have"],["Students ___ wear a uniform at my school.","have to","has to","must to"],["Yesterday I ___ work late.","had to","must","have to"],["You ___ see a doctor about that cough.","should","shouldn't","don't have to"],["She ___ get up early tomorrow.","has to","have to","must to"],["Passengers ___ use phones during take-off.","mustn't","don't have to","needn't to"]]},{"id":"g20","lv":"B1","t":"The passive (present & past)","fa":"مجهول (حال و گذشته)","r":[["be + past participle: English is spoken here. The bridge was built in 1900.","be + قسمت سوم فعل."],["Use it when the action matters more than who did it, or the doer is unknown.","وقتی خود عمل مهم‌تر از انجام‌دهنده است یا انجام‌دهنده معلوم نیست."],["Add by + agent only if it's important: The book was written by Hafez.","اگر انجام‌دهنده مهم است با by بیاورید."]],"ex":[["Rice is grown in the north of Iran.","در شمال ایران برنج کشت می‌شود."],["My car was stolen last night.","دیشب ماشینم دزدیده شد."],["The emails are checked every morning.","ایمیل‌ها هر صبح بررسی می‌شوند."],["This house was built in 1950.","این خانه در سال ۱۹۵۰ ساخته شد."],["The Shahnameh was written by Ferdowsi.","شاهنامه را فردوسی سروده است."],["We were invited to the wedding.","ما به عروسی دعوت شدیم."]],"tip":"در فارسی مجهول کمتر به کار می‌رود و جمله را با «آن را...» می‌سازیم، ولی در انگلیسی رسمی و خبری مجهول بسیار رایج است.","d":[["English ___ all over the world.","is spoken","speaks","is speak"],["The window ___ yesterday.","was broken","is broken","broke by"],["These cars ___ in Germany.","are made","made","are make"],["The letter ___ by my grandfather.","was written","wrote","is write"],["The meeting ___ every Monday.","is held","holds","was hold"],["My phone ___ last week.","was stolen","is stolen","stole"],["The museum ___ in 1937.","was opened","opened by","is opening"],["Breakfast ___ from 7 to 10.","is served","serves","is serve"]]},{"id":"g21","lv":"B1","t":"Relative clauses: who, which, that, where, whose","fa":"جملات موصولی: who، which، that، where، whose","r":[["who for people, which for things, that for both (in defining clauses).","who برای انسان، which برای اشیا، that برای هر دو."],["where for places, whose for possession: the town where I grew up; the man whose car…","where برای مکان، whose برای مالکیت."],["You can drop who/which/that when it is the object: the book (that) I read.","وقتی ضمیر موصولی مفعول است می‌توان حذفش کرد."],["Extra information goes between commas and can't use that: My sister, who lives in Rome, …","اطلاعات اضافی بین دو ویرگول می‌آید و با that ساخته نمی‌شود."]],"ex":[["The woman who lives next door is a nurse.","زنی که در همسایگی زندگی می‌کند پرستار است."],["This is the phone which I bought.","این گوشی‌ای است که خریدم."],["That's the restaurant where we met.","آن رستورانی است که در آن همدیگر را دیدیم."],["He's the friend whose father is a pilot.","او دوستی است که پدرش خلبان است."],["The film we watched was great.","فیلمی که دیدیم عالی بود."],["My boss, who is very kind, gave me a day off.","رئیسم، که خیلی مهربان است، یک روز مرخصی به من داد."]],"tip":"«که» فارسی همه‌کاره است، ولی در انگلیسی باید who/which/where/whose را درست انتخاب کنید و ضمیر تکراری نیاورید: the book that I read it ✗.","d":[["The man ___ called you is my uncle.","who","which","where"],["This is the house ___ I was born.","where","which","who"],["I lost the ring ___ my mother gave me.","that","who","where"],["She's the girl ___ brother is a doctor.","whose","who","which"],["The book ___ is on the table is mine.","which","who","whose"],["Tehran, ___ is the capital, is very big.","which","that","where"],["Choose the correct sentence:","The film we saw was great.","The film we saw it was great.","The film who we saw was great."],["The people ___ work here are friendly.","who","which","whose"]]},{"id":"g22","lv":"B2","t":"Narrative tenses: past continuous & past perfect","fa":"زمان‌های روایی: گذشتهٔ استمراری و ماضی بعید","r":[["Past continuous = background action in progress: I was walking home when it started to rain.","گذشتهٔ استمراری برای کاری که در جریان بود (پس‌زمینه)."],["Past simple = the main events: It started to rain.","گذشتهٔ ساده برای رویدادهای اصلی داستان."],["Past perfect (had + participle) = earlier past: When I arrived, the train had left.","ماضی بعید برای اتفاقی که قبل از اتفاق دیگری در گذشته رخ داده بود."]],"ex":[["I was cooking when the phone rang.","داشتم آشپزی می‌کردم که تلفن زنگ زد."],["While we were driving, we saw an accident.","وقتی داشتیم رانندگی می‌کردیم، تصادفی دیدیم."],["When we got to the cinema, the film had started.","وقتی به سینما رسیدیم، فیلم شروع شده بود."],["She had never flown before that trip.","او قبل از آن سفر هرگز پرواز نکرده بود."],["I realised I had left my passport at home.","فهمیدم پاسپورتم را در خانه جا گذاشته بودم."],["They were living in Tabriz when their son was born.","وقتی پسرشان به دنیا آمد در تبریز زندگی می‌کردند."]],"tip":"«جا گذاشته بودم» دقیقاً ماضی بعید است: had left. فارسی‌زبان‌ها خوب آن را می‌فهمند؛ فقط فراموش نکنید had را با همهٔ اشخاص یکسان به کار ببرید.","d":[["I ___ TV when you called.","was watching","watched","had watched"],["When I arrived, everyone ___ home.","had gone","went","was going"],["She ___ her leg while she was skiing.","broke","was breaking","had broke"],["We ___ dinner when the lights went out.","were having","had","have had"],["He told me he ___ the film before.","had seen","saw","has seen"],["While I ___ to work, I met an old friend.","was walking","walked","had walked"],["By the time the police came, the thief ___.","had escaped","escaped","was escaping"],["I couldn't get in because I ___ my keys.","had lost","was losing","have lost"]]},{"id":"g23","lv":"B2","t":"Reported speech","fa":"نقل قول غیرمستقیم","r":[["Tenses usually move back: 'I'm tired' → She said she was tired.","زمان‌ها معمولاً یک قدم به گذشته می‌روند."],["will → would, can → could, present perfect → past perfect.","will به would، can به could، حال کامل به ماضی بعید."],["say (something) vs tell (someone): He said that… / He told me that…","say بدون مفعول شخصی، tell با مفعول شخصی: told me."],["Reported questions use statement order: She asked where I lived (NOT where did I live).","در سؤال غیرمستقیم ترتیب جملهٔ خبری می‌آید: asked where I lived."]],"ex":[["He said he was busy.","گفت سرش شلوغ است."],["She told me she would call later.","به من گفت بعداً زنگ می‌زند."],["They said they had already eaten.","گفتند قبلاً غذا خورده‌اند."],["He asked me where I worked.","از من پرسید کجا کار می‌کنم."],["She asked if I could help her.","پرسید آیا می‌توانم کمکش کنم."],["The doctor told me to rest.","دکتر به من گفت استراحت کنم."]],"tip":"در فارسی زمان در نقل قول عوض نمی‌شود («گفت خسته است»)، اما در انگلیسی معمولاً عوض می‌شود: He said he was tired.","d":[["'I'm hungry.' → She said she ___ hungry.","was","is","has been"],["'I'll help you.' → He said he ___ help me.","would","will","can"],["He ___ me that he was leaving.","told","said","asked"],["She ___ that she liked the film.","said","told","talked"],["'Where do you live?' → He asked me where I ___.","lived","did live","do live"],["'Can you swim?' → She asked if I ___ swim.","could","can","would can"],["'I've finished.' → He said he ___ finished.","had","has","have"],["The teacher told us ___ quiet.","to be","be","being"]]},{"id":"g24","lv":"B2","t":"Third & mixed conditionals; wish","fa":"شرطی نوع سوم و ترکیبی؛ wish","r":[["Third conditional (imaginary past): If + had + participle, would have + participle.","شرطی نوع سوم برای گذشتهٔ غیرواقعی (حسرت یا انتقاد)."],["Mixed: past condition, present result: If I had studied medicine, I would be a doctor now.","شرطی ترکیبی: شرط در گذشته، نتیجه در حال."],["wish + past = present regret: I wish I had more time. wish + past perfect = past regret: I wish I had told her.","wish + گذشته برای حسرت حال؛ wish + ماضی بعید برای حسرت گذشته."]],"ex":[["If I had known, I would have helped you.","اگر می‌دانستم، کمکت می‌کردم."],["If we hadn't missed the bus, we wouldn't have been late.","اگر اتوبوس را از دست نداده بودیم، دیر نمی‌رسیدیم."],["If she had taken the job, she would be in London now.","اگر آن کار را قبول کرده بود، الان در لندن بود."],["I wish I spoke better English.","کاش انگلیسی‌ام بهتر بود."],["I wish I hadn't said that.","کاش آن حرف را نزده بودم."],["If only I had listened to you!","کاش به حرفت گوش داده بودم!"]],"tip":"«کاش» فارسی برای حال و گذشته یک کلمه است؛ در انگلیسی زمان فعل بعد از wish تعیین می‌کند حسرت دربارهٔ حال است یا گذشته.","d":[["If I had studied, I ___ the exam.","would have passed","would pass","will pass"],["If you ___ me, I would have come.","had called","called","have called"],["I wish I ___ taller.","were","am","will be"],["I wish I ___ that mistake yesterday.","hadn't made","didn't make","don't make"],["If she ___ the train, she'd be here now.","hadn't missed","didn't miss","doesn't miss"],["If they had left earlier, they ___ caught in traffic.","wouldn't have got","won't get","didn't get"],["I wish I ___ a car. Buses are slow.","had","have","will have"],["If only I ___ his advice!","had followed","followed","follow"]]},{"id":"g25","lv":"B2","t":"Gerund or infinitive?","fa":"اسم مصدر (-ing) یا مصدر با to؟","r":[["Verb + -ing: enjoy, avoid, finish, mind, suggest, keep, consider: I enjoy swimming.","بعد از این افعال -ing می‌آید: enjoy, avoid, finish, mind, suggest."],["Verb + to: want, decide, hope, plan, agree, refuse, promise, afford: I decided to stay.","بعد از این افعال to + فعل می‌آید: want, decide, hope, plan."],["After prepositions always -ing: I'm interested in learning. Thanks for coming.","بعد از حرف اضافه همیشه -ing."],["Meaning changes: stop smoking (quit) vs stop to smoke (pause in order to); remember doing (memory) vs remember to do (don't forget).","با stop و remember معنی عوض می‌شود."]],"ex":[["I enjoy cooking for my family.","از آشپزی برای خانواده‌ام لذت می‌برم."],["She decided to study abroad.","تصمیم گرفت در خارج درس بخواند."],["Would you mind waiting a moment?","ممکن است لحظه‌ای صبر کنید؟"],["He's good at solving problems.","در حل مسئله ماهر است."],["Remember to lock the door.","یادت باشد در را قفل کنی."],["I remember visiting Isfahan as a child.","یادم می‌آید در کودکی به اصفهان رفتم."],["He stopped smoking last year.","پارسال سیگار را ترک کرد."]],"tip":"در فارسی بعد از همهٔ این افعال «مصدر» یا «که + فعل» می‌آید، پس باید ترکیب‌ها را حفظ کنید: look forward to seeing (نه to see).","d":[["I enjoy ___ in the sea.","swimming","to swim","swim"],["We decided ___ a new car.","to buy","buying","buy"],["She's interested ___ photography.","in learning","to learn","learn"],["Would you mind ___ the window?","opening","to open","open"],["They can't afford ___ on holiday.","to go","going","go"],["I'm looking forward to ___ you.","seeing","see","saw"],["He avoided ___ the question.","answering","to answer","answer"],["Remember ___ milk on your way home!","to buy","buying","buy"]]},{"id":"g26","lv":"B2","t":"Modals of deduction: must, might, can't (have)","fa":"افعال وجهی برای استنتاج","r":[["must = I'm sure it's true: She must be tired. (she worked 12 hours)","must وقتی تقریباً مطمئنیم درست است."],["might/may/could = possible: He might be at home.","might/may/could برای احتمال."],["can't = I'm sure it's not true: That can't be Ali, he's in Paris.","can't وقتی مطمئنیم درست نیست."],["About the past: must/might/can't + have + participle: She must have forgotten.","برای گذشته: must have / might have / can't have + قسمت سوم."]],"ex":[["You must be hungry after your journey.","حتماً بعد از سفر گرسنه‌ای."],["She might be in a meeting.","شاید در جلسه باشد."],["That can't be true!","امکان ندارد درست باشد!"],["He must have missed the train.","حتماً قطار را از دست داده."],["They might have got lost.","شاید گم شده باشند."],["She can't have seen us.","امکان ندارد ما را دیده باشد."]],"tip":"«حتماً» = must، «شاید» = might، «امکان ندارد» = can't (نه mustn't). mustn't برای ممنوعیت است، نه استنتاج.","d":[["He's been working all day. He ___ be exhausted.","must","can't","mustn't"],["I'm not sure where she is. She ___ be at the gym.","might","must","can't"],["That ___ be Sara. She's in Canada!","can't","mustn't","might"],["The ground is wet. It ___ have rained.","must","can't","should"],["He didn't answer. He ___ have been asleep.","might","can't","mustn't"],["She ___ have taken the car — the keys are here.","can't","must","might"],["You ___ be joking!","must","can","should"],["They're late. They ___ have got stuck in traffic.","may","can't","mustn't"]]},{"id":"g27","lv":"C1","t":"Inversion for emphasis","fa":"وارونگی برای تأکید","r":[["After negative or limiting adverbs at the start, use question order: Never have I seen such a view.","اگر قید منفی یا محدودکننده اول جمله بیاید، ترتیب سؤالی می‌شود."],["Common starters: Never, Rarely, Seldom, Not only, No sooner… than, Hardly… when, Under no circumstances, Only then.","شروع‌کننده‌های رایج: Never, Rarely, Not only, No sooner, Under no circumstances."],["It is formal and dramatic: use it in writing, speeches and presentations.","این ساختار رسمی و تأکیدی است؛ برای نوشتار و سخنرانی."]],"ex":[["Never have I felt so welcome.","هرگز این‌قدر احساس خوش‌آمد نکرده بودم."],["Not only did she finish early, but she also helped others.","نه‌تنها زود تمام کرد، بلکه به دیگران هم کمک کرد."],["Rarely do we see such talent.","به‌ندرت چنین استعدادی می‌بینیم."],["No sooner had I arrived than it started to rain.","تازه رسیده بودم که باران شروع شد."],["Under no circumstances should you share your password.","تحت هیچ شرایطی نباید رمزتان را به کسی بدهید."],["Only then did I understand the problem.","تنها آن موقع بود که مشکل را فهمیدم."]],"tip":"در فارسی جابه‌جایی کلمات برای تأکید آزاد است، ولی در انگلیسی وارونگی فقط بعد از این قیدها و با فعل کمکی (do/have/should) ممکن است.","d":[["Never ___ such a beautiful sunset.","have I seen","I have seen","I saw"],["Not only ___ late, but he also forgot the tickets.","was he","he was","he is"],["Rarely ___ he complain.","does","he does","do"],["No sooner had we sat down ___ the phone rang.","than","when","that"],["Under no circumstances ___ open this door.","should you","you should","you must"],["Only later ___ the truth.","did she realise","she realised","she did realise"],["Hardly ___ started when the lights went out.","had the film","the film had","the film has"],["Seldom ___ such a generous offer.","do we receive","we receive","we do receive"]]},{"id":"g28","lv":"C1","t":"Cleft sentences: What… is, It is… that","fa":"جملات تأکیدی شکافته","r":[["It is/was + focus + that/who…: It was Sara who called. (not someone else)","It was + بخش مورد تأکید + that/who."],["What + clause + is/was…: What I need is a holiday.","What + جمله + is/was برای برجسته کردن."],["All (that) I want is…, The reason (why)… is…, The thing that… is…","ساختارهای مشابه: All I want is…, The reason why… is…"]],"ex":[["It was my brother who broke the window.","برادرم بود که پنجره را شکست."],["What I love about London is the parks.","چیزی که دربارهٔ لندن دوست دارم پارک‌هایش است."],["It's the price that worries me.","قیمتش است که نگرانم می‌کند."],["What we need is more time.","چیزی که لازم داریم زمان بیشتر است."],["All I want is a quiet weekend.","تنها چیزی که می‌خواهم یک آخر هفتهٔ آرام است."],["The reason I called is to apologise.","دلیل تماسم عذرخواهی است."]],"tip":"این ساختار معادل «...بود که...» در فارسی است و برای اصلاح سوءتفاهم بسیار کاربردی است: It was Tuesday, not Monday, that we met.","d":[["___ was Ali who told me.","It","What","That"],["What I need ___ a good night's sleep.","is","it is","that"],["It's the noise ___ annoys me.","that","what","who"],["___ I like most is the food.","What","It","That"],["All I want ___ to go home.","is","it","what"],["It was in 2010 ___ we met.","that","what","which"],["The reason ___ I'm late is the traffic.","why","what","because"],["___ surprised me was his honesty.","What","It","That"]]},{"id":"g29","lv":"C1","t":"Advanced passive & causative (have/get something done)","fa":"مجهول پیشرفته و سببی","r":[["Causative: have/get + object + past participle = someone does it for you: I had my car repaired.","have/get + مفعول + قسمت سوم یعنی کسی کاری را برایتان انجام می‌دهد."],["Impersonal passive: It is said/believed that…; He is thought to be…","مجهول غیرشخصی: It is said that… / He is believed to be…"],["Passive with modals and perfect: It should be done. It has been decided.","مجهول با افعال وجهی و زمان کامل: should be done, has been decided."]],"ex":[["I'm having my hair cut tomorrow.","فردا موهایم را کوتاه می‌کنم (در آرایشگاه)."],["We got the roof fixed last week.","هفتهٔ پیش سقف را تعمیر کردیم (کسی برایمان)."],["It is believed that the city is 3,000 years old.","گمان می‌رود این شهر ۳۰۰۰ سال قدمت داشته باشد."],["He is said to be the best surgeon in the country.","گفته می‌شود او بهترین جراح کشور است."],["The decision has already been made.","تصمیم قبلاً گرفته شده است."],["This form must be signed by a manager.","این فرم باید به امضای مدیر برسد."]],"tip":"«ماشینم را تعمیر کردم» در فارسی ممکن است یعنی کسی دیگر تعمیر کرده؛ در انگلیسی اگر خودتان نکرده‌اید بگویید I had my car repaired.","d":[["I need to ___ my eyes tested.","have","make","do"],["She got her phone ___.","repaired","repair","repairing"],["It ___ that he lives abroad.","is said","says","is saying"],["He is believed ___ the money.","to have stolen","stealing","that he stole"],["The work must ___ by Friday.","be finished","finish","be finishing"],["We're having our kitchen ___ next month.","painted","paint","to paint"],["A decision ___ yet.","hasn't been made","hasn't made","isn't make"],["She is thought ___ the best candidate.","to be","being","be"]]},{"id":"g30","lv":"C1","t":"Hedging & softening","fa":"زبان محتاطانه و ملایم‌سازی","r":[["Softeners make opinions polite and academic: It seems that…, It would appear that…, tend to.","عبارات ملایم‌کننده نظر را مؤدبانه و علمی می‌کنند."],["Modals of possibility: may, might, could: This could lead to delays.","با may/might/could قطعیت را کم کنید."],["Adverbs: arguably, possibly, somewhat, relatively, to some extent.","قیدهایی مثل arguably, somewhat, to some extent."],["Polite disagreement: I'm not sure I agree… / I see it slightly differently.","مخالفت مؤدبانه: I'm not sure I agree / I see it slightly differently."]],"ex":[["It seems that the plan needs more work.","به نظر می‌رسد برنامه به کار بیشتری نیاز دارد."],["People tend to spend more in December.","مردم معمولاً در دسامبر بیشتر خرج می‌کنند."],["This could be a problem in the future.","این ممکن است در آینده مشکل‌ساز شود."],["The results are, to some extent, encouraging.","نتایج تا حدی امیدوارکننده است."],["It's arguably the best film of the year.","می‌توان گفت بهترین فیلم سال است."],["I'm not sure I'd agree with that.","مطمئن نیستم با آن موافق باشم."],["The price is somewhat higher than expected.","قیمت تا حدی بالاتر از انتظار است."]],"tip":"صراحت زیاد مثل You are wrong در انگلیسی (به‌ویژه بریتانیایی) بی‌ادبانه به نظر می‌رسد؛ بگویید I'm not sure that's quite right.","d":[["The new policy ___ to be working.","seems","is seem","seeming"],["Prices ___ rise next year, but it's not certain.","may","must","will definitely"],["People ___ to eat less in summer.","tend","tends","are tend"],["Choose the most polite disagreement:","I'm not sure I agree with that.","You're wrong.","That's stupid."],["The results are ___ disappointing.","somewhat","very totally","extremely absolutely"],["It ___ appear that the data is incomplete.","would","will","is"],["This is ___ the most important issue.","arguably","argue","argued"],["Choose the best hedge:","This could cause delays.","This causes delays, 100%.","This will destroy everything."]]}],"extra":{"listen":[{"id":"p01","lv":"A1","t":"My new neighbour","fa":"همسایهٔ جدیدم","s":[["My name is Maryam and I live in a small flat in Manchester.","اسم من مریم است و در یک آپارتمان کوچک در منچستر زندگی می‌کنم."],["Last week a new neighbour moved in next door.","هفتهٔ پیش یک همسایهٔ جدید به واحد بغلی آمد."],["Her name is Grace. She's from Scotland and she's a nurse.","اسمش گریس است. اهل اسکاتلند و پرستار است."],["She works at night, so she sleeps in the morning.","شب‌ها کار می‌کند، پس صبح‌ها می‌خوابد."],["On Sunday, I made Persian tea and invited her in.","یکشنبه چای ایرانی درست کردم و دعوتش کردم بیاید تو."],["She loved the tea and now we are good friends.","عاشق چای شد و حالا دوستان خوبی هستیم."]],"q":[{"q":"What is Grace's job?","o":["She's a nurse","She's a teacher","She's a doctor"]},{"q":"Why does Grace sleep in the morning?","o":["She works at night","She is ill","She is on holiday"]}]},{"id":"p02","lv":"A1","t":"A day at the market","fa":"یک روز در بازار","s":[["Every Saturday morning, I go to the market with my son.","هر شنبه صبح با پسرم به بازار می‌روم."],["We buy fruit, vegetables and fresh bread.","میوه، سبزیجات و نان تازه می‌خریم."],["The apples are cheap, but the cherries are expensive.","سیب‌ها ارزان‌اند، ولی گیلاس‌ها گران‌اند."],["My son always wants a cake from the bakery.","پسرم همیشه از نانوایی یک کیک می‌خواهد."],["We pay in cash because some sellers don't take cards.","نقد می‌پردازیم چون بعضی فروشنده‌ها کارت قبول نمی‌کنند."],["At twelve o'clock, we go home and make lunch.","ساعت دوازده به خانه می‌رویم و ناهار درست می‌کنیم."]],"q":[{"q":"What is expensive at the market?","o":["The cherries","The apples","The bread"]},{"q":"Why do they pay in cash?","o":["Some sellers don't take cards","Cash is cheaper","They don't have a card"]}]},{"id":"p03","lv":"A2","t":"A trip to Edinburgh","fa":"سفری به ادینبرو","s":[["Last month my husband and I took the train to Edinburgh.","ماه گذشته من و شوهرم با قطار به ادینبرو رفتیم."],["The journey took four and a half hours, but the views were beautiful.","سفر چهار ساعت و نیم طول کشید، ولی مناظر زیبا بود."],["We stayed in a small hotel near the castle.","در هتل کوچکی نزدیک قلعه اقامت کردیم."],["On the first day it rained, so we visited the museum.","روز اول باران بارید، پس به موزه رفتیم."],["On the second day the sun came out and we climbed a hill called Arthur's Seat.","روز دوم آفتاب درآمد و از تپه‌ای به نام آرتورز سیت بالا رفتیم."],["We were tired, but it was the best part of the trip.","خسته بودیم، اما بهترین بخش سفر بود."]],"q":[{"q":"How did they travel to Edinburgh?","o":["By train","By plane","By car"]},{"q":"What did they do on the rainy day?","o":["They visited the museum","They climbed a hill","They stayed in the hotel"]}]},{"id":"p04","lv":"A2","t":"Voicemail from the dentist","fa":"پیام صوتی از دندان‌پزشکی","s":[["Hello, this is a message for Mr Hosseini from Bright Smile Dental.","سلام، این پیامی برای آقای حسینی از دندان‌پزشکی برایت اسمایل است."],["Your appointment is on Wednesday the fifth at 2:15.","وقت شما چهارشنبه پنجم ساعت ۲:۱۵ است."],["Unfortunately, Dr Lewis is ill that day.","متأسفانه دکتر لوئیس آن روز بیمار است."],["We can offer you Thursday at the same time, or Friday at 10 a.m.","می‌توانیم پنجشنبه همان ساعت یا جمعه ساعت ۱۰ صبح را پیشنهاد کنیم."],["Please call us back on 0161 496 0021.","لطفاً با شمارهٔ ۰۱۶۱ ۴۹۶ ۰۰۲۱ با ما تماس بگیرید."],["Thank you, and sorry for the change.","ممنون، و بابت تغییر عذر می‌خواهیم."]],"q":[{"q":"Why must the appointment change?","o":["The dentist is ill","The clinic is closed","Mr Hosseini is busy"]},{"q":"Which new times are offered?","o":["Thursday 2:15 or Friday 10 a.m.","Wednesday or Thursday","Friday 2:15 only"]}]},{"id":"p05","lv":"B1","t":"Learning to drive at forty","fa":"یادگیری رانندگی در چهل سالگی","s":[["I never learned to drive in Iran because I always lived in big cities with good public transport.","در ایران هرگز رانندگی یاد نگرفتم چون همیشه در شهرهای بزرگ با حمل‌ونقل عمومی خوب زندگی می‌کردم."],["When we moved to a village in England, everything changed.","وقتی به روستایی در انگلستان رفتیم، همه‌چیز عوض شد."],["The nearest supermarket was twelve kilometres away and the bus came twice a day.","نزدیک‌ترین سوپرمارکت دوازده کیلومتر دور بود و اتوبوس روزی دو بار می‌آمد."],["So, at forty, I booked my first driving lesson.","پس در چهل سالگی اولین جلسهٔ آموزش رانندگی را رزرو کردم."],["I failed my first test because I was too nervous at a roundabout.","در اولین امتحانم رد شدم چون سر یک میدان خیلی مضطرب بودم."],["I practised for two more months and passed the second time. Now I feel free.","دو ماه دیگر تمرین کردم و بار دوم قبول شدم. حالا احساس آزادی می‌کنم."]],"q":[{"q":"Why didn't the speaker learn to drive in Iran?","o":["Public transport was good","Cars were too expensive","She was too young"]},{"q":"Why did she fail the first test?","o":["She was nervous at a roundabout","She drove too fast","She was late"]}]},{"id":"p06","lv":"B1","t":"Tips for your first week at work","fa":"نکاتی برای هفتهٔ اول کار","s":[["Starting a new job can be stressful, but a few simple habits help.","شروع یک کار جدید می‌تواند استرس‌زا باشد، اما چند عادت ساده کمک می‌کند."],["First, arrive a little early and introduce yourself to your colleagues.","اول، کمی زودتر برسید و خودتان را به همکارانتان معرفی کنید."],["Don't be afraid to ask questions; people expect it in the first weeks.","از پرسیدن نترسید؛ در هفته‌های اول همه انتظارش را دارند."],["Take notes, because you will hear a lot of new names and systems.","یادداشت بردارید، چون نام‌ها و سیستم‌های جدید زیادی خواهید شنید."],["Try to join colleagues for lunch, even if you are shy.","سعی کنید ناهار را با همکاران بخورید، حتی اگر خجالتی هستید."],["Finally, ask your manager for feedback at the end of the first month.","در پایان، آخر ماه اول از مدیرتان بازخورد بخواهید."]],"q":[{"q":"Why should you take notes?","o":["You'll hear many new names and systems","Your boss checks them","It's a company rule"]},{"q":"When should you ask for feedback?","o":["At the end of the first month","On the first day","After a year"]}]},{"id":"p07","lv":"B1","t":"The return of the bicycle","fa":"بازگشت دوچرخه","s":[["In many European cities, bicycles are becoming more popular every year.","در بسیاری از شهرهای اروپا، دوچرخه هر سال محبوب‌تر می‌شود."],["Cities have built safe cycle lanes, separated from cars.","شهرها مسیرهای ایمن دوچرخه، جدا از خودروها، ساخته‌اند."],["Electric bikes have also made longer journeys and hills much easier.","دوچرخه‌های برقی هم سفرهای طولانی‌تر و سربالایی‌ها را بسیار آسان‌تر کرده‌اند."],["People say they save money and feel healthier.","مردم می‌گویند در هزینه صرفه‌جویی می‌کنند و احساس سلامتی بیشتری دارند."],["However, some shop owners worry that fewer parking spaces mean fewer customers.","با این حال، برخی مغازه‌داران نگران‌اند که پارکینگ کمتر یعنی مشتری کمتر."],["Studies show the opposite: cyclists visit shops more often and spend more per month.","مطالعات خلاف آن را نشان می‌دهد: دوچرخه‌سواران بیشتر به مغازه‌ها سر می‌زنند و ماهانه بیشتر خرج می‌کنند."]],"q":[{"q":"What made hills easier?","o":["Electric bikes","New roads","Cheaper bikes"]},{"q":"What do studies show about cyclists?","o":["They spend more per month in shops","They never go shopping","They prefer big supermarkets"]}]},{"id":"p08","lv":"B2","t":"Why we procrastinate","fa":"چرا کارها را به تعویق می‌اندازیم","s":[["Most of us have put off an important task until the last minute.","بیشتر ما یک کار مهم را تا لحظهٔ آخر عقب انداخته‌ایم."],["Psychologists argue that procrastination isn't really about laziness.","روان‌شناسان استدلال می‌کنند که تعلل واقعاً به تنبلی مربوط نیست."],["It's about avoiding the unpleasant feelings a task gives us, such as boredom or fear of failure.","بلکه به اجتناب از احساسات ناخوشایندی برمی‌گردد که یک کار به ما می‌دهد، مثل کسالت یا ترس از شکست."],["One effective strategy is to break a big task into very small steps.","یک راهبرد مؤثر این است که کار بزرگ را به گام‌های خیلی کوچک تقسیم کنیم."],["Another is the 'two-minute rule': if something takes less than two minutes, do it now.","دیگری «قانون دو دقیقه» است: اگر کاری کمتر از دو دقیقه طول می‌کشد، همین الان انجامش بده."],["Above all, being kind to yourself after a delay makes you less likely to delay again.","مهم‌تر از همه، مهربان بودن با خودتان بعد از یک تأخیر، احتمال تأخیر دوباره را کم می‌کند."]],"q":[{"q":"According to psychologists, procrastination is mainly about…","o":["avoiding unpleasant feelings","laziness","lack of time"]},{"q":"What is the 'two-minute rule'?","o":["Do short tasks immediately","Work for two minutes, then rest","Plan for two minutes every morning"]}]},{"id":"p09","lv":"B2","t":"Balancing the grid","fa":"متعادل‌سازی شبکهٔ برق","s":[["Electricity has to be produced at exactly the moment it is used.","برق باید دقیقاً در همان لحظه‌ای که مصرف می‌شود تولید شود."],["With more solar and wind power, supply now depends on the weather.","با افزایش انرژی خورشیدی و بادی، عرضه اکنون به آب‌وهوا بستگی دارد."],["On sunny afternoons there can be too much power, and in the evening too little.","در بعدازظهرهای آفتابی ممکن است برق بیش از حد باشد و عصرها خیلی کم."],["Large batteries solve part of this problem by storing cheap midday energy.","باتری‌های بزرگ با ذخیرهٔ انرژی ارزان ظهر، بخشی از این مشکل را حل می‌کنند."],["They can respond in milliseconds, which is far faster than a gas power station.","آن‌ها در چند میلی‌ثانیه واکنش نشان می‌دهند که بسیار سریع‌تر از یک نیروگاه گازی است."],["As battery prices fall, experts expect storage to become a standard part of every solar project.","با کاهش قیمت باتری، کارشناسان انتظار دارند ذخیره‌سازی بخش استاندارد هر پروژهٔ خورشیدی شود."]],"q":[{"q":"Why is solar and wind power a challenge for the grid?","o":["Supply depends on the weather","It is too expensive","It produces too much noise"]},{"q":"What advantage do batteries have over gas stations?","o":["They respond much faster","They are bigger","They work only at night"]}]},{"id":"p10","lv":"B2","t":"A complaint call","fa":"تماس برای شکایت","s":[["Good morning. I'm calling about an order I placed three weeks ago.","صبح بخیر. دربارهٔ سفارشی تماس می‌گیرم که سه هفته پیش ثبت کردم."],["The website said delivery would take five working days, but nothing has arrived.","وب‌سایت گفته بود تحویل پنج روز کاری طول می‌کشد، ولی هنوز چیزی نرسیده."],["I've emailed twice and haven't had a reply, which is frustrating.","دو بار ایمیل زده‌ام و پاسخی نگرفته‌ام که کلافه‌کننده است."],["I'd like to know where the parcel is, or else I'd like a full refund.","می‌خواهم بدانم بسته کجاست، وگرنه بازپرداخت کامل می‌خواهم."],["The agent apologised and explained that it had been sent to the wrong address.","کارمند عذرخواهی کرد و توضیح داد که بسته به آدرس اشتباه فرستاده شده بود."],["She offered to send a new one by express delivery at no extra cost.","او پیشنهاد کرد یک بستهٔ جدید با پست سریع بدون هزینهٔ اضافه بفرستد."]],"q":[{"q":"What had gone wrong?","o":["It was sent to the wrong address","It was broken","It was the wrong size"]},{"q":"What does the company offer?","o":["A new parcel by express delivery, free","A 10% discount","A refund only"]}]},{"id":"p11","lv":"C1","t":"The myth of multitasking","fa":"افسانهٔ چندکارگی","s":[["It's widely accepted that we live in an age of distraction, yet many of us still pride ourselves on multitasking.","به‌طور گسترده پذیرفته شده که در عصر حواس‌پرتی زندگی می‌کنیم، با این حال بسیاری از ما هنوز به چندکاره بودن خود می‌بالیم."],["Research suggests, however, that the brain doesn't truly do two demanding things at once.","با این حال، پژوهش‌ها نشان می‌دهد که مغز واقعاً دو کار دشوار را هم‌زمان انجام نمی‌دهد."],["Instead, it switches rapidly between them, and every switch carries a small cost in time and accuracy.","بلکه به‌سرعت بین آن‌ها جابه‌جا می‌شود و هر جابه‌جایی هزینهٔ کوچکی در زمان و دقت دارد."],["Over a day, these costs add up to a surprising loss of productivity.","در طول یک روز، این هزینه‌ها به افت شگفت‌آوری در بهره‌وری می‌انجامد."],["Not only does constant switching tire us, but it also makes deep thinking far less likely.","جابه‌جایی مداوم نه‌تنها ما را خسته می‌کند، بلکه احتمال تفکر عمیق را نیز بسیار کم می‌کند."],["The bottom line is that protecting blocks of uninterrupted time may be the most valuable skill of all.","خلاصهٔ کلام اینکه حفاظت از بازه‌های زمانی بدون وقفه شاید ارزشمندترین مهارت باشد."]],"q":[{"q":"What does the brain actually do when 'multitasking'?","o":["Switches quickly between tasks","Does both tasks at once","Ignores one task"]},{"q":"What is the speaker's main recommendation?","o":["Protect uninterrupted time","Do more tasks at once","Take more breaks"]}]},{"id":"p12","lv":"C1","t":"Living between two languages","fa":"زندگی میان دو زبان","s":[["When I first arrived in Canada, I assumed that fluency was simply a matter of vocabulary.","وقتی تازه به کانادا رسیدم، فکر می‌کردم روانی زبان صرفاً به دایرهٔ واژگان بستگی دارد."],["It took me years to realise that what really separates a fluent speaker is the ability to be subtle.","سال‌ها طول کشید تا بفهمم آنچه واقعاً یک گویندهٔ روان را متمایز می‌کند، توانایی بیان ظریف است."],["In Persian, I could soften a refusal with a dozen polite phrases; in English I sounded blunt without meaning to.","در فارسی می‌توانستم یک «نه» را با ده‌ها عبارت مؤدبانه نرم کنم؛ در انگلیسی بی‌آنکه بخواهم رُک به نظر می‌رسیدم."],["Gradually, I learned expressions like 'I'm not sure that would work' and 'that's a fair point, but…'.","به‌تدریج عباراتی مثل «مطمئن نیستم جواب بدهد» و «نکتهٔ منصفانه‌ای است، اما...» را یاد گرفتم."],["Interestingly, the Persian habit of taarof turned out to be a blessing in disguise: I already understood that politeness is a skill.","جالب اینکه عادت تعارف ایرانی خیری پنهان از آب درآمد: از قبل می‌دانستم که ادب یک مهارت است."],["Now I feel I don't just translate myself; I can actually be myself in both languages.","حالا احساس می‌کنم فقط خودم را ترجمه نمی‌کنم؛ واقعاً می‌توانم در هر دو زبان خودم باشم."]],"q":[{"q":"What did the speaker think fluency was at first?","o":["A matter of vocabulary","A matter of accent","A matter of grammar"]},{"q":"How did taarof help the speaker?","o":["It taught that politeness is a skill","It made English easier to pronounce","It helped with writing"]}]}],"sounds":[{"id":"s1","t":"th: /θ/ and /ð/","fa":"صدای th","fa2":"فارسی این صدا را ندارد. نوک زبان را آرام بین دندان‌ها بگذارید و هوا را بیرون بدهید. think را «سینک» یا «تینک» نگویید.","p":[["think","sink"],["three","tree"],["this","dis"],["thank","tank"],["mouth","mouse"]]},{"id":"s2","t":"v and w","fa":"تفاوت v و w","fa2":"برای w لب‌ها را گرد کنید (مثل «و» در «نو» با لب گرد) و دندان به لب نخورد. برای v دندان بالا روی لب پایین است. wine و vine را متفاوت بگویید.","p":[["wine","vine"],["west","vest"],["wet","vet"],["worse","verse"],["while","vile"]]},{"id":"s3","t":"No extra 'e' before s + consonant","fa":"اضافه نکردن «اِ» قبل از s","fa2":"فارسی‌زبان‌ها school را «اِسکول» می‌گویند. مستقیم با s شروع کنید: s-chool، s-treet، s-port.","p":[["school","eschool ✗"],["street","estreet ✗"],["Spain","Espain ✗"],["student","estudent ✗"],["sport","esport ✗"]]},{"id":"s4","t":"Short /ɪ/ vs long /iː/","fa":"«ای» کوتاه و بلند","fa2":"ship کوتاه و شل است، sheep بلند و کشیده. اگر کوتاه و بلند را یکی کنید معنی عوض می‌شود.","p":[["ship","sheep"],["live","leave"],["fill","feel"],["sit","seat"],["bit", function voiceScore(v, accent, male) {
  let s = 0; const id = (v.name + ' ' + v.voiceURI).toLowerCase();
  if (v.lang.replace('_', '-').toUpperCase().endsWith(accent)) s += 50;
  if (/premium|enhanced|neural|natural/.test(id)) s += 20;
  if (/novelty|whisper|bells|bad news|boing|bubbles|cellos|zarvox|trinoids|organ|albert|jester|superstar|wobble|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/.test(id)) s -= 80;
  const m = /daniel|arthur|oliver|alex|tom|aaron|fred|guy|ryan|male|david|mark|george|james/.test(id);
  const f = /samantha|serena|kate|karen|moira|tessa|martha|ava|allison|susan|victoria|zira|female|libby|sonia|jenny|aria|fiona|catherine/.test(id);
  if (male === true && m) s += 15; if (male === false && f) s += 15;

  if (male == null && pref) { const v = VOICES.find(x => x.voiceURI === pref); if (v) return v; }

function distractWords(w, n, field) {
  const same = WORDS.filter(x => x.id !== w.id && x.pos === w.pos && x[field] !== w[field]);
  const near = same.filter(x => x.u === w.u || x.lv === w.lv);
  const pool = near.length >= n ? near : same.length >= n ? same : WORDS.filter(x => x.id !== w.id);
  const out = [], seen = new Set([w[field]]);
  for (const x of shuffle(pool)) { if (!seen.has(x[field])) { seen.add(x[field]); out.push(x); } if (out.length >= n) break; }
  return out;
}
function mcq(body, opts, correct, done, cls) {

      if (box.dataset.done) return; box.dataset.done = 1;
      const ok = o === correct; b.classList.add(ok ? 'ok' : 'bad'); haptic(ok);
      if (!ok) [...box.children].forEach(x => { if (x.textContent === correct) x.classList.add('ok'); });

function step() {

  const body = $('#rbody');

    const p = k.split(':');
    if (p[0] === 'w' && WMAP[p[1]]) out.push(wordEx(WMAP[p[1]]));
    else if (p[0] === 'g' && GMAP[p[1]] && GMAP[p[1]].d[+p[2]]) out.push(grammarDrill(GMAP[p[1]], +p[2]));
    else if (p[0] === 'l' && UMAP[p[1]]) out.push(dlgQuestion(UMAP[p[1]], +p[2]));
    else if (p[0] === 'p') { const P = LISTEN.find(x => x.id === p[1]); if (P) out.push(passageQ(P, +p[2])); }
    else delete ST.miss[k];
  });
  return out;
}
function buildDaily() {
  const items = [], usedW = new Set();
  // 1. warm-up: mistakes from earlier sessions
  missItems(5).forEach(x => { items.push(x); if (x.w) usedW.add(x.w.id); });
  // 2. due reviews
  const due = dueList().filter(w => !usedW.has(w.id)).slice(0, 14);
  due.slice(0, 6).forEach(w => { items.push(wordEx(w)); usedW.add(w.id); });
  // 3. new words of the next lesson: intro card, then a check after every two
  const L = nextLesson(); const fresh = L ? L.words.filter(id => !ST.cards[id]).slice(0, ST.perDay || 8).map(id => WMAP[id]) : [];
  const half = Math.ceil(fresh.length / 2);
  const intro = (ws, off) => ws.forEach((w, i) => { items.push(introCard(w, L, off + i, fresh.length)); if (i % 2 === 1) { items.push(wordEx(ws[i - 1], 'en2fa')); items.push(wordEx(w, 'listen')); } });
  intro(fresh.slice(0, half), 0);
  if (fresh.length % 2 && half) items.push(wordEx(fresh[half - 1], 'en2fa'));
  // 4. grammar every day: the next rule on the path, or a review of the oldest learned rule
  const g = nextGrammar();
  if (g) { const seen = ST.gram[g.id] && ST.gram[g.id].t; items.push(grammarTeach(g, false)); pick([...g.d.keys()], 4).forEach(k => items.push(grammarDrill(g, k))); }
  else { const rv = gramReviewPool()[0]; if (rv) { items.push(grammarTeach(rv, true)); pick([...rv.d.keys()], 3).forEach(k => items.push(grammarDrill(rv, k))); } }
  intro(fresh.slice(half), half);
  if ((fresh.length - half) % 2) items.push(wordEx(fresh[fresh.length - 1], 'fa2en'));
  // 5. remaining reviews, mixed with production practice of today's words
  due.slice(6).forEach(w => items.push(wordEx(w)));
  fresh.forEach(w => { if (blankIn(w.ex, w.w)) items.push(wordEx(w, 'cloze')); });
  // 6. listening: when today's lesson finishes a unit, hear its dialogue and answer
  if (L && L.k === Math.ceil(UMAP[L.u].w.length / 8) - 1 && fresh.length && !ST.dlg[L.u]) { const u = UMAP[L.u]; items.push(dialogueCard(u, true)); u.d.q.forEach((_, k) => items.push(dlgQuestion(u, k))); }
  return items;
}
function quickReview() {
  const ws = seenWords(); if (!ws.length) return toast('Learn some words first');

}

      <button class="btn" id="pnext" style="margin-top:12px">Answer the questions →</button>`;

      body.querySelector('#pplay').onclick = play;
      body.querySelector('#pshow').onclick = () => body.querySelector('#ptext').classList.toggle('hide');
      body.querySelector('#pnext').onclick = () => { stopSpeech(); DLG_RUN++; done(true); };
      bindSpeed(body); setTimeout(play, 80);
    }
  };
}
function passageQ(P, k) {
  const q = P.q[k];
  return {
    kind: 'pq', key: 'p:' + P.id + ':' + k, render(body, done) { body.innerHTML = `<div class="eyebrow">${esc(P.t)}</div><div class="card" style="margin-top:16px;font-size:18px;font-weight:700">${esc(q.q)}</div>`; mcq(body, q.o, q.o[0], done); },
    grade(ok) { const s = ST.lis[P.id] || (ST.lis[P.id] = { n: 0, ok: 0 }); s.n++; if (ok) s.ok++; if (!ok) missNote('p:' + P.id + ':' + k, false); save(); },
    feedback: () => esc(q.o[0]), remake: () => passageQ(P, k)
  };
}
