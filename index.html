ing"]]},{"id":"g12","lv":"A2","t":"Countable & uncountable: some, any, much, many","fa":"اسم‌های قابل‌شمارش و غیرقابل‌شمارش","r":[["Countable nouns have plurals (apples). Uncountable don't (water, money, advice, information, luggage).","قابل‌شمارش‌ها جمع دارند؛ غیرقابل‌شمارش‌ها مثل water, advice, information جمع بسته نمی‌شوند."],["some in positive sentences; any in negatives and questions: I have some time. Have you got any milk?","some در جملهٔ مثبت؛ any در منفی و سؤالی (در تعارف some: Would you like some tea?)."],["many + countable, much + uncountable (mainly negatives/questions); a lot of for both.","many برای قابل‌شمارش، much برای غیرقابل‌شمارش؛ a lot of برای هر دو."]],"ex":[["There's some bread on the table.","مقداری نان روی میز است."],["I don't have any money.","هیچ پولی ندارم."],["How many children do you have?","چند تا بچه دارید؟"],["How much is it?","چند است؟"],["She gave me some good advice.","چند نصیحت خوب به من کرد."],["We have a lot of homework.","تکلیف زیادی داریم."],["Would you like some tea?","چای میل دارید؟"]],"tip":"advice, information, furniture, news در فارسی شمردنی‌اند ولی در انگلیسی نه: an advice ✗ → a piece of advice ✓.","d":[["How ___ apples do you want?","many","much","any"],["I don't have ___ time today.","much","many","some"],["Is there ___ milk?","any","many","a"],["Can you give me some ___?","advice","advices","an advice"],["There are ___ people here.","a lot of","much","any"],["How ___ does it cost?","much","many","lot"],["Would you like ___ cake?","some","any","many"],["The ___ is good today.","news","newses","new"]]},{"id":"g13","lv":"A2","t":"Comparatives & superlatives","fa":"صفت تفضیلی و عالی","r":[["Short adjectives: -er / the -est: cheap → cheaper → the cheapest; big → bigger → the biggest.","صفات کوتاه: -er و the -est (با دو برابر شدن حرف آخر در big)."],["Long adjectives: more / the most: expensive → more expensive → the most expensive.","صفات بلند: more و the most."],["Irregular: good → better → the best; bad → worse → the worst; far → further.","بی‌قاعده: better/best، worse/worst."],["Compare with than: Tehran is bigger than Shiraz. Equal: as … as.","مقایسه با than؛ برابری با as … as."]],"ex":[["My flat is smaller than yours.","آپارتمان من از مال تو کوچک‌تر است."],["This is the most beautiful city in Iran.","این زیباترین شهر ایران است."],["Today is hotter than yesterday.","امروز از دیروز گرم‌تر است."],["She's the best student in the class.","او بهترین دانشجوی کلاس است."],["The train is more comfortable than the bus.","قطار از اتوبوس راحت‌تر است."],["He's as tall as his father.","هم‌قد پدرش است."],["That was the worst film I've ever seen.","آن بدترین فیلمی بود که تا حالا دیده‌ام."]],"tip":"در فارسی «از» قبل از مقایسه می‌آید؛ در انگلیسی than بعد از صفت: bigger than (نه more big from).","d":[["This bag is ___ than that one.","cheaper","more cheap","cheapest"],["She's the ___ person I know.","kindest","kinder","most kind"],["Gold is ___ than silver.","more expensive","expensiver","most expensive"],["My English is ___ than last year.","better","gooder","best"],["It's the ___ day of the year.","hottest","hotter","most hot"],["He is as old ___ me.","as","than","like"],["Today's weather is ___ than yesterday's.","worse","badder","worst"],["Russia is the ___ country in the world.","biggest","bigger","most big"]]},{"id":"g37","lv":"A2","t":"too, enough, very","fa":"too، enough و very","r":[["very = a lot (neutral): It's very hot.","very یعنی خیلی (بدون بار منفی)."],["too + adjective = more than is good: It's too hot to go out.","too یعنی بیش از حد (معمولاً منفی)."],["adjective + enough = sufficient: Is it warm enough? / enough + noun: enough money.","enough بعد از صفت و قبل از اسم."],["Negative: not big enough, not enough time.","منفی: not big enough / not enough time."]],"ex":[["This coffee is too hot to drink.","این قهوه برای نوشیدن زیادی داغ است."],["The flat is very nice.","آپارتمان خیلی خوب است."],["He isn't old enough to drive.","هنوز به سنی نرسیده که رانندگی کند."],["We don't have enough chairs.","صندلی به اندازهٔ کافی نداریم."],["These shoes are too small for me.","این کفش‌ها برایم کوچک‌اند."],["Is the room big enough?","اتاق به اندازهٔ کافی بزرگ است؟"]],"tip":"در فارسی «خیلی» برای هر دو است، اما در انگلیسی too یعنی «بیش از حد» و معمولاً مشکل را نشان می‌دهد: The test was too easy یعنی متأسفانه زیادی آسان بود.","d":[["I can't drink it. It's ___ hot.","too","very","enough"],["She isn't ___ to vote.","old enough","enough old","too old"],["We don't have ___.","enough money","money enough","too money"],["The film was ___ good. I loved it.","very","too","enough"],["This bag is ___ heavy. I can't carry it.","too","very","enough"],["Is your coffee hot ___?","enough","too","very"],["There aren't ___ for everyone.","enough chairs","chairs enough","too chairs"],["He speaks ___ quickly. I can't understand him.","too","enough","very much"]]},{"id":"g38","lv":"A2","t":"Adjectives & adverbs (-ly)","fa":"صفت و قید (-ly)","r":[["Adjectives describe nouns: a quick lunch, a careful driver.","صفت اسم را توصیف می‌کند."],["Adverbs describe verbs, often adjective + -ly: She drives carefully.","قید فعل را توصیف می‌کند و اغلب با -ly ساخته می‌شود."],["Irregular: good → well, fast → fast, hard → hard, late → late.","بی‌قاعده: good → well، fast و hard بدون تغییر."],["After be, look, feel, sound, taste use the adjective: You look tired. It tastes good.","بعد از be, look, feel, taste صفت می‌آید: It tastes good."]],"ex":[["She speaks English well.","او انگلیسی را خوب صحبت می‌کند."],["Please drive slowly.","لطفاً آهسته رانندگی کن."],["He's a good cook.","آشپز خوبی است."],["They work hard.","آن‌ها سخت کار می‌کنند."],["You look happy today.","امروز شاد به نظر می‌رسی."],["The soup smells delicious.","سوپ بوی خوبی می‌دهد."]],"tip":"در فارسی «خوب» هم صفت است هم قید («خوب حرف می‌زند»)؛ در انگلیسی برای فعل well بگویید: She speaks well (نه speaks good).","d":[["He drives very ___.","carefully","careful","care"],["She is a ___ singer.","good","well","goodly"],["You speak English very ___.","well","good","goodly"],["Please speak ___. I'm learning.","slowly","slow","slowness"],["They worked ___ all day.","hard","hardly","hardy"],["This cake tastes ___.","delicious","deliciously","delicious-ly"],["The train arrived ___.","late","lately","latly"],["She answered the question ___.","correctly","correct","correction"]]},{"id":"g14","lv":"A2","t":"Future: going to & will","fa":"آینده: going to و will","r":[["be going to = a plan already decided: I'm going to visit my aunt.","going to برای برنامه‌ای که از قبل تصمیمش گرفته شده."],["will = a decision now, a promise, an offer or a prediction: I'll help you. It will rain.","will برای تصمیم لحظه‌ای، قول، پیشنهاد کمک و پیش‌بینی."],["going to for predictions with present evidence: Look at those clouds — it's going to rain.","وقتی شواهدی الان دیده می‌شود: Look… it's going to rain."],["Present continuous for fixed arrangements: I'm meeting Ali at six.","قرارهای قطعی با حال استمراری: I'm meeting Ali at six."]],"ex":[["I'm going to study medicine.","قرار است پزشکی بخوانم."],["The phone's ringing. I'll answer it.","تلفن زنگ می‌زند. من جواب می‌دهم."],["I'll call you tomorrow, I promise.","قول می‌دهم فردا زنگ بزنم."],["Be careful! You're going to fall!","مواظب باش! الان می‌افتی!"],["I think prices will go up.","فکر می‌کنم قیمت‌ها بالا می‌رود."],["We're flying to Shiraz on Friday.","جمعه به شیراز پرواز می‌کنیم."]],"tip":"در فارسی برای آینده اغلب حال ساده می‌گوییم («فردا می‌روم»). در انگلیسی I go tomorrow معمولاً غلط است؛ بگویید I'm going tomorrow یا I'll go.","d":[["Look at the sky! It ___ rain.","is going to","will","goes to"],["A: I'm cold. B: I ___ close the window.","'ll","am going to","close"],["We ___ visit Isfahan next summer. We've booked the hotel.","are going to","will","visit"],["I promise I ___ be late.","won't","am not going to","don't"],["I think she ___ win.","will","is going","wins"],["What ___ you going to do this weekend?","are","will","do"],["I ___ meeting my boss at 3 p.m.","am","will","going"],["Don't worry, I ___ help you.","'ll","am going","going to"]]},{"id":"g16","lv":"B1","t":"Present perfect: ever, never, just, already, yet","fa":"حال کامل: ever، never، just، already، yet","r":[["have/has + past participle: I have finished. She has gone.","have/has + قسمت سوم فعل."],["Use it for life experience (time not stated): Have you ever been to Japan?","برای تجربه‌های زندگی بدون ذکر زمان دقیق."],["just = a moment ago; already = sooner than expected; yet = until now (questions/negatives, at the end).","just یعنی همین الان؛ already یعنی زودتر از انتظار؛ yet در سؤال و منفی، آخر جمله."],["Results now: I've lost my keys (= I don't have them now).","برای نتیجه‌ای که الان اهمیت دارد."]],"ex":[["Have you ever eaten sushi?","تا حالا سوشی خورده‌ای؟"],["I've never been to Canada.","هیچ‌وقت کانادا نرفته‌ام."],["She's just left.","همین الان رفت."],["We've already booked the tickets.","بلیت‌ها را قبلاً رزرو کرده‌ایم."],["Have you finished yet?","تمامش کردی؟"],["I haven't decided yet.","هنوز تصمیم نگرفته‌ام."],["He's lost his wallet.","کیف پولش را گم کرده."]],"tip":"«گذشتهٔ نقلی» فارسی شبیه حال کامل است، اما اگر زمان مشخص گذشته بیاید (yesterday، in 2020) باید از گذشتهٔ ساده استفاده کنید.","d":[["Have you ever ___ to Paris?","been","went","go"],["I've ___ finished my homework.","just","yet","ever"],["She hasn't called ___.","yet","already","just"],["We've ___ seen this film. Let's watch another.","already","yet","ever"],["He ___ lost his phone.","has","have","is"],["I've never ___ a horse.","ridden","rode","ride"],["Have they arrived ___?","yet","already","never"],["___ you ever met a famous person?","Have","Did","Has"]]},{"id":"g17","lv":"B1","t":"Present perfect vs past simple; for & since","fa":"حال کامل در برابر گذشتهٔ ساده؛ for و since","r":[["Past simple = finished time: I saw him yesterday / in 2019 / last week.","گذشتهٔ ساده با زمان تمام‌شده: yesterday, last week, in 2019."],["Present perfect = unfinished time or no time: I've seen him today / this week.","حال کامل برای زمان تمام‌نشده یا بدون زمان: today, this week."],["for + a period (for three years); since + a starting point (since 2020, since Monday).","for + مدت زمان؛ since + نقطهٔ شروع."],["How long have you lived here? — I've lived here for five years.","How long برای پرسیدن مدت با حال کامل."]],"ex":[["I've lived in London for six years.","شش سال است که در لندن زندگی می‌کنم."],["She's worked here since 2021.","از سال ۲۰۲۱ این‌جا کار می‌کند."],["We moved here in 2019.","سال ۲۰۱۹ به این‌جا آمدیم."],["How long have you known Ali?","چند وقت است علی را می‌شناسی؟"],["I haven't seen her since Monday.","از دوشنبه او را ندیده‌ام."],["I saw her last Monday.","دوشنبهٔ گذشته او را دیدم."],["Have you had lunch today?","امروز ناهار خورده‌ای؟"]],"tip":"«شش سال است که این‌جا زندگی می‌کنم» را با حال ساده نگویید (I live here for six years ✗)؛ درست: I've lived here for six years.","d":[["I ___ here since 2018.","have lived","live","lived"],["She went to Spain ___.","last year","for a year","since last year"],["We've known each other ___ ten years.","for","since","from"],["He's been ill ___ Friday.","since","for","from"],["I ___ him yesterday.","saw","have seen","see"],["How long ___ you had this car?","have","did","do"],["They ___ married in 2015.","got","have got","get"],["I ___ my keys. I can't find them.","have lost","lost","lose"]]},{"id":"g39","lv":"B1","t":"Present perfect continuous","fa":"حال کامل استمراری","r":[["have/has been + -ing: I've been waiting for an hour.","have/has been + فعلِ ing‌دار."],["An activity that started in the past and is still going on (often with for/since).","کاری که از گذشته شروع شده و هنوز ادامه دارد."],["It can explain a present result: I'm tired because I've been running.","برای توضیح نتیجهٔ فعلی: خسته‌ام چون داشتم می‌دویدم."],["State verbs (know, like, have = own) use the simple form: I've known him for years.","افعال حالتی با حال کامل ساده: I've known him."]],"ex":[["I've been learning English for two years.","دو سال است که دارم انگلیسی یاد می‌گیرم."],["It's been raining since this morning.","از صبح دارد باران می‌بارد."],["How long have you been waiting?","چند وقت است منتظری؟"],["She's been working here since March.","از ماه مارس این‌جا کار می‌کند."],["Your eyes are red. Have you been crying?","چشمانت قرمز است. گریه می‌کردی؟"],["I've known Ali since school.","علی را از دوران مدرسه می‌شناسم."]],"tip":"«دو سال است که انگلیسی می‌خوانم» را با حال ساده نگویید؛ درست: I've been studying English for two years.","d":[["I ___ for you for an hour!","have been waiting","am waiting","wait"],["How long ___ you been living here?","have","did","are"],["She's been working ___ 9 a.m.","since","for","from"],["They've been talking ___ two hours.","for","since","during"],["I'm hot because I ___.","have been running","run","am run"],["I ___ him for ten years.","have known","have been knowing","know"],["It ___ all day.","has been snowing","is snowing since","snows"],["What ___ you been doing lately?","have","has","did"]]},{"id":"g18","lv":"B1","t":"First & second conditionals","fa":"جملات شرطی نوع اول و دوم","r":[["First conditional (real future): If + present, will + verb. If it rains, I'll stay home.","شرطی نوع اول (احتمال واقعی): If + حال ساده، will + فعل."],["Second conditional (imaginary/unlikely): If + past, would + verb. If I had money, I'd travel.","شرطی نوع دوم (فرضی یا نامحتمل): If + گذشته، would + فعل."],["Use were for all persons in formal style: If I were you, I'd accept.","در نوع دوم برای همهٔ اشخاص were رایج است: If I were you."],["Never use will in the if-clause: If it will rain ✗.","هرگز will را بعد از if نیاورید."]],"ex":[["If you study, you'll pass.","اگر درس بخوانی، قبول می‌شوی."],["If I see her, I'll tell her.","اگر ببینمش، به او می‌گویم."],["If I won the lottery, I'd buy a house.","اگر لاتاری می‌بردم، خانه می‌خریدم."],["If I were you, I wouldn't do that.","من جای تو بودم آن کار را نمی‌کردم."],["What would you do if you lost your job?","اگر کارت را از دست می‌دادی چه می‌کردی؟"],["If we leave now, we won't miss the train.","اگر الان راه بیفتیم، قطار را از دست نمی‌دهیم."]],"tip":"در فارسی بعد از «اگر» گاهی آینده می‌گوییم؛ در انگلیسی بعد از if، will نیاورید: If it rains (نه If it will rain).","d":[["If it ___ tomorrow, we'll stay home.","rains","will rain","rained"],["If I ___ rich, I'd travel the world.","were","am","will be"],["If you heat ice, it ___.","melts","would melt","melted"],["I ___ help you if I had time.","would","will","am"],["If she calls, I ___ you.","'ll tell","told","would told"],["If I were you, I ___ apply.","would","will","am"],["What would you do if you ___ a million dollars?","had","have","will have"],["We'll be late if we ___ hurry.","don't","won't","didn't"]]},{"id":"g40","lv":"B1","t":"used to & be used to","fa":"used to و be used to","r":[["used to + verb = a past habit or state that is not true now: I used to smoke.","used to + فعل: عادتی در گذشته که دیگر نیست."],["Negative/question: didn't use to / Did you use to…?","منفی و سؤالی با did و use (بدون d)."],["be used to + -ing/noun = be familiar with: I'm used to the cold.","be used to: به چیزی عادت داشتن (آشنا بودن)."],["get used to = become familiar: You'll get used to driving on the left.","get used to: کم‌کم عادت کردن."]],"ex":[["I used to live in Isfahan.","قبلاً در اصفهان زندگی می‌کردم."],["We didn't use to have a car.","قبلاً ماشین نداشتیم."],["Did you use to play football?","قبلاً فوتبال بازی می‌کردی؟"],["I'm used to getting up early.","به زود بیدار شدن عادت دارم."],["She can't get used to the weather here.","نمی‌تواند به هوای این‌جا عادت کند."],["There used to be a cinema here.","قبلاً این‌جا یک سینما بود."]],"tip":"«قبلاً... می‌کردم» در فارسی دقیقاً used to است. ولی I'm used to با ing می‌آید: I'm used to working (نه to work).","d":[["I ___ smoke, but I stopped.","used to","use to","was used to"],["Did you ___ live here?","use to","used to","using to"],["I'm used to ___ in English.","working","work","worked"],["She ___ have long hair.","used to","is used to","uses to"],["You'll soon get used to ___ on the left.","driving","drive","drove"],["We ___ use to go out much.","didn't","weren't","don't"],["There ___ to be a bank here.","used","use","was used"],["He isn't used to ___ so much.","eating","eat","ate"]]},{"id":"g19","lv":"B1","t":"Obligation & advice: must, have to, should","fa":"اجبار و توصیه: must، have to، should","r":[["must = strong obligation, often from the speaker: I must call my mum.","must اجبار قوی، معمولاً از طرف خود گوینده یا قوانین نوشته‌شده."],["have to = obligation from outside rules: I have to wear a uniform.","have to اجبار بیرونی (قانون، شرایط)."],["mustn't = it is forbidden · don't have to = it is not necessary.","mustn't یعنی ممنوع؛ don't have to یعنی لازم نیست. تفاوت مهمی دارند!"],["should = advice: You should see a doctor.","should برای توصیه و نصیحت."]],"ex":[["You must wear a seatbelt.","باید کمربند ایمنی ببندی."],["I have to work on Saturday.","شنبه باید کار کنم."],["You mustn't smoke here.","این‌جا سیگار کشیدن ممنوع است."],["You don't have to come if you're busy.","اگر سرت شلوغ است لازم نیست بیایی."],["You should drink more water.","بهتر است آب بیشتری بنوشی."],["Did you have to pay for parking?","مجبور شدی پول پارکینگ بدهی؟"],["We had to wait an hour.","مجبور شدیم یک ساعت صبر کنیم."]],"tip":"«نباید» فارسی دو معنی دارد: mustn't (ممنوع) و don't have to (لازم نیست). You don't have to pay یعنی پرداخت لازم نیست، نه ممنوع است.","d":[["You ___ park here. It's illegal.","mustn't","don't have to","shouldn't to"],["It's free. You ___ pay.","don't have to","mustn't","must"],["You look tired. You ___ go to bed.","should","must to","have"],["Students ___ wear a uniform at my school.","have to","has to","must to"],["Yesterday I ___ work late.","had to","must","have to"],["You ___ see a doctor about that cough.","should","shouldn't","don't have to"],["She ___ get up early tomorrow.","has to","have to","must to"],["Passengers ___ use phones during take-off.","mustn't","don't have to","needn't to"]]},{"id":"g20","lv":"B1","t":"The passive (present & past)","fa":"مجهول (حال و گذشته)","r":[["be + past participle: English is spoken here. The bridge was built in 1900.","be + قسمت سوم فعل."],["Use it when the action matters more than who did it, or the doer is unknown.","وقتی خود عمل مهم‌تر از انجام‌دهنده است یا انجام‌دهنده معلوم نیست."],["Add by + agent only if it's important: The book was written by Hafez.","اگر انجام‌دهنده مهم است با by بیاورید."]],"ex":[["Rice is grown in the north of Iran.","در شمال ایران برنج کشت می‌شود."],["My car was stolen last night.","دیشب ماشینم دزدیده شد."],["The emails are checked every morning.","ایمیل‌ها هر صبح بررسی می‌شوند."],["This house was built in 1950.","این خانه در سال ۱۹۵۰ ساخته شد."],["The Shahnameh was written by Ferdowsi.","شاهنامه را فردوسی سروده است."],["We were invited to the wedding.","ما به عروسی دعوت شدیم."]],"tip":"در فارسی مجهول کمتر به کار می‌رود و جمله را با «آن را...» می‌سازیم، ولی در انگلیسی رسمی و خبری مجهول بسیار رایج است.","d":[["English ___ all over the world.","is spoken","speaks","is speak"],["The window ___ yesterday.","was broken","is broken","broke by"],["These cars ___ in Germany.","are made","made","are make"],["The letter ___ by my grandfather.","was written","wrote","is write"],["The meeting ___ every Monday.","is held","holds","was hold"],["My phone ___ last week.","was stolen","is stolen","stole"],["The museum ___ in 1937.","was opened","opened by","is opening"],["Breakfast ___ from 7 to 10.","is served","serves","is serve"]]},{"id":"g21","lv":"B1","t":"Relative clauses: who, which, that, where, whose","fa":"جملات موصولی: who، which، that، where، whose","r":[["who for people, which for things, that for both (in defining clauses).","who برای انسان، which برای اشیا، that برای هر دو."],["where for places, whose for possession: the town where I grew up; the man whose car…","where برای مکان، whose برای مالکیت."],["You can drop who/which/that when it is the object: the book (that) I read.","وقتی ضمیر موصولی مفعول است می‌توان حذفش کرد."],["Extra information goes between commas and can't use that: My sister, who lives in Rome, …","اطلاعات اضافی بین دو ویرگول می‌آید و با that ساخته نمی‌شود."]],"ex":[["The woman who lives next door is a nurse.","زنی که در همسایگی زندگی می‌کند پرستار است."],["This is the phone which I bought.","این گوشی‌ای است که خریدم."],["That's the restaurant where we met.","آن رستورانی است که در آن همدیگر را دیدیم."],["He's the friend whose father is a pilot.","او دوستی است که پدرش خلبان است."],["The film we watched was great.","فیلمی که دیدیم عالی بود."],["My boss, who is very kind, gave me a day off.","رئیسم، که خیلی مهربان است، یک روز مرخصی به من داد."]],"tip":"«که» فارسی همه‌کاره است، ولی در انگلیسی باید who/which/where/whose را درست انتخاب کنید و ضمیر تکراری نیاورید: the book that I read it ✗.","d":[["The man ___ called you is my uncle.","who","which","where"],["This is the house ___ I was born.","where","which","who"],["I lost the ring ___ my mother gave me.","that","who","where"],["She's the girl ___ brother is a doctor.","whose","who","which"],["The book ___ is on the table is mine.","which","who","whose"],["Tehran, ___ is the capital, is very big.","which","that","where"],["Choose the correct sentence:","The film we saw was great.","The film we saw it was great.","The film who we saw was great."],["The people ___ work here are friendly.","who","which","whose"]]},{"id":"g41","lv":"B1","t":"Indirect (polite) questions","fa":"سؤال غیرمستقیم (مؤدبانه)","r":[["Start politely: Could you tell me…? Do you know…? I wonder…","با Could you tell me…? یا Do you know…? شروع کنید."],["Then use statement word order (no do/does/did): Could you tell me where the station is?","سپس ترتیب جملهٔ خبری؛ بدون do/does: where the station is."],["For yes/no questions use if or whether: Do you know if the shop is open?","برای سؤال بله/خیر از if یا whether استفاده کنید."]],"ex":[["Could you tell me where the toilet is?","ممکن است بگویید سرویس بهداشتی کجاست؟"],["Do you know what time the bank opens?","می‌دانید بانک ساعت چند باز می‌شود؟"],["I wonder why she left.","نمی‌دانم چرا رفت."],["Do you know if this bus goes to the airport?","می‌دانید این اتوبوس به فرودگاه می‌رود؟"],["Can you tell me how much it costs?","می‌شود بگویید قیمتش چقدر است؟"],["I'd like to know when the course starts.","می‌خواهم بدانم دوره کِی شروع می‌شود."]],"tip":"این ساختار مثل «ببخشید، می‌دانید...؟» فارسی است و خیلی مؤدبانه‌تر از سؤال مستقیم است. خطای رایج: Could you tell me where is the station ✗.","d":[["Could you tell me where the station ___?","is","is it","does it"],["Do you know what time ___?","the film starts","does the film start","starts the film"],["I wonder ___ he is late.","why","why is","why does"],["Do you know ___ the shop is open?","if","that","what"],["Can you tell me how much ___?","it costs","does it cost","costs it"],["Choose the correct sentence:","Do you know where she lives?","Do you know where does she live?","Do you know where lives she?"],["I'd like to know when ___.","the train leaves","does the train leave","leaves the train"],["Could you tell me ___ this seat is free?","whether","what","which"]]},{"id":"g22","lv":"B2","t":"Narrative tenses: past continuous & past perfect","fa":"زمان‌های روایی: گذشتهٔ استمراری و ماضی بعید","r":[["Past continuous = background action in progress: I was walking home when it started to rain.","گذشتهٔ استمراری برای کاری که در جریان بود (پس‌زمینه)."],["Past simple = the main events: It started to rain.","گذشتهٔ ساده برای رویدادهای اصلی داستان."],["Past perfect (had + participle) = earlier past: When I arrived, the train had left.","ماضی بعید برای اتفاقی که قبل از اتفاق دیگری در گذشته رخ داده بود."]],"ex":[["I was cooking when the phone rang.","داشتم آشپزی می‌کردم که تلفن زنگ زد."],["While we were driving, we saw an accident.","وقتی داشتیم رانندگی می‌کردیم، تصادفی دیدیم."],["When we got to the cinema, the film had started.","وقتی به سینما رسیدیم، فیلم شروع شده بود."],["She had never flown before that trip.","او قبل از آن سفر هرگز پرواز نکرده بود."],["I realised I had left my passport at home.","فهمیدم پاسپورتم را در خانه جا گذاشته بودم."],["They were living in Tabriz when their son was born.","وقتی پسرشان به دنیا آمد در تبریز زندگی می‌کردند."]],"tip":"«جا گذاشته بودم» دقیقاً ماضی بعید است: had left. فارسی‌زبان‌ها خوب آن را می‌فهمند؛ فقط فراموش نکنید had را با همهٔ اشخاص یکسان به کار ببرید.","d":[["I ___ TV when you called.","was watching","watched","had watched"],["When I arrived, everyone ___ home.","had gone","went","was going"],["She ___ her leg while she was skiing.","broke","was breaking","had broke"],["We ___ dinner when the lights went out.","were having","had","have had"],["He told me he ___ the film before.","had seen","saw","has seen"],["While I ___ to work, I met an old friend.","was walking","walked","had walked"],["By the time the police came, the thief ___.","had escaped","escaped","was escaping"],["I couldn't get in because I ___ my keys.","had lost","was losing","have lost"]]},{"id":"g23","lv":"B2","t":"Reported speech","fa":"نقل قول غیرمستقیم","r":[["Tenses usually move back: 'I'm tired' → She said she was tired.","زمان‌ها معمولاً یک قدم به گذشته می‌روند."],["will → would, can → could, present perfect → past perfect.","will به would، can به could، حال کامل به ماضی بعید."],["say (something) vs tell (someone): He said that… / He told me that…","say بدون مفعول شخصی، tell با مفعول شخصی: told me."],["Reported questions use statement order: She asked where I lived (NOT where did I live).","در سؤال غیرمستقیم ترتیب جملهٔ خبری می‌آید: asked where I lived."]],"ex":[["He said he was busy.","گفت سرش شلوغ است."],["She told me she would call later.","به من گفت بعداً زنگ می‌زند."],["They said they had already eaten.","گفتند قبلاً غذا خورده‌اند."],["He asked me where I worked.","از من پرسید کجا کار می‌کنم."],["She asked if I could help her.","پرسید آیا می‌توانم کمکش کنم."],["The doctor told me to rest.","دکتر به من گفت استراحت کنم."]],"tip":"در فارسی زمان در نقل قول عوض نمی‌شود («گفت خسته است»)، اما در انگلیسی معمولاً عوض می‌شود: He said he was tired.","d":[["'I'm hungry.' → She said she ___ hungry.","was","is","has been"],["'I'll help you.' → He said he ___ help me.","would","will","can"],["He ___ me that he was leaving.","told","said","asked"],["She ___ that she liked the film.","said","told","talked"],["'Where do you live?' → He asked me where I ___.","lived","did live","do live"],["'Can you swim?' → She asked if I ___ swim.","could","can","would can"],["'I've finished.' → He said he ___ finished.","had","has","have"],["The teacher told us ___ quiet.","to be","be","being"]]},{"id":"g24","lv":"B2","t":"Third & mixed conditionals; wish","fa":"شرطی نوع سوم و ترکیبی؛ wish","r":[["Third conditional (imaginary past): If + had + participle, would have + participle.","شرطی نوع سوم برای گذشتهٔ غیرواقعی (حسرت یا انتقاد)."],["Mixed: past condition, present result: If I had studied medicine, I would be a doctor now.","شرطی ترکیبی: شرط در گذشته، نتیجه در حال."],["wish + past = present regret: I wish I had more time. wish + past perfect = past regret: I wish I had told her.","wish + گذشته برای حسرت حال؛ wish + ماضی بعید برای حسرت گذشته."]],"ex":[["If I had known, I would have helped you.","اگر می‌دانستم، کمکت می‌کردم."],["If we hadn't missed the bus, we wouldn't have been late.","اگر اتوبوس را از دست نداده بودیم، دیر نمی‌رسیدیم."],["If she had taken the job, she would be in London now.","اگر آن کار را قبول کرده بود، الان در لندن بود."],["I wish I spoke better English.","کاش انگلیسی‌ام بهتر بود."],["I wish I hadn't said that.","کاش آن حرف را نزده بودم."],["If only I had listened to you!","کاش به حرفت گوش داده بودم!"]],"tip":"«کاش» فارسی برای حال و گذشته یک کلمه است؛ در انگلیسی زمان فعل بعد از wish تعیین می‌کند حسرت دربارهٔ حال است یا گذشته.","d":[["If I had studied, I ___ the exam.","would have passed","would pass","will pass"],["If you ___ me, I would have come.","had called","called","have called"],["I wish I ___ taller.","were","am","will be"],["I wish I ___ that mistake yesterday.","hadn't made","didn't make","don't make"],["If she ___ the train, she'd be here now.","hadn't missed","didn't miss","doesn't miss"],["If they had left earlier, they ___ caught in traffic.","wouldn't have got","won't get","didn't get"],["I wish I ___ a car. Buses are slow.","had","have","will have"],["If only I ___ his advice!","had followed","followed","follow"]]},{"id":"g25","lv":"B2","t":"Gerund or infinitive?","fa":"اسم مصدر (-ing) یا مصدر با to؟","r":[["Verb + -ing: enjoy, avoid, finish, mind, suggest, keep, consider: I enjoy swimming.","بعد از این افعال -ing می‌آید: enjoy, avoid, finish, mind, suggest."],["Verb + to: want, decide, hope, plan, agree, refuse, promise, afford: I decided to stay.","بعد از این افعال to + فعل می‌آید: want, decide, hope, plan."],["After prepositions always -ing: I'm interested in learning. Thanks for coming.","بعد از حرف اضافه همیشه -ing."],["Meaning changes: stop smoking (quit) vs stop to smoke (pause in order to); remember doing (memory) vs remember to do (don't forget).","با stop و remember معنی عوض می‌شود."]],"ex":[["I enjoy cooking for my family.","از آشپزی برای خانواده‌ام لذت می‌برم."],["She decided to study abroad.","تصمیم گرفت در خارج درس بخواند."],["Would you mind waiting a moment?","ممکن است لحظه‌ای صبر کنید؟"],["He's good at solving problems.","در حل مسئله ماهر است."],["Remember to lock the door.","یادت باشد در را قفل کنی."],["I remember visiting Isfahan as a child.","یادم می‌آید در کودکی به اصفهان رفتم."],["He stopped smoking last year.","پارسال سیگار را ترک کرد."]],"tip":"در فارسی بعد از همهٔ این افعال «مصدر» یا «که + فعل» می‌آید، پس باید ترکیب‌ها را حفظ کنید: look forward to seeing (نه to see).","d":[["I enjoy ___ in the sea.","swimming","to swim","swim"],["We decided ___ a new car.","to buy","buying","buy"],["She's interested ___ photography.","in learning","to learn","learn"],["Would you mind ___ the window?","opening","to open","open"],["They can't afford ___ on holiday.","to go","going","go"],["I'm looking forward to ___ you.","seeing","see","saw"],["He avoided ___ the question.","answering","to answer","answer"],["Remember ___ milk on your way home!","to buy","buying","buy"]]},{"id":"g26","lv":"B2","t":"Modals of deduction: must, might, can't (have)","fa":"افعال وجهی برای استنتاج","r":[["must = I'm sure it's true: She must be tired. (she worked 12 hours)","must وقتی تقریباً مطمئنیم درست است."],["might/may/could = possible: He might be at home.","might/may/could برای احتمال."],["can't = I'm sure it's not true: That can't be Ali, he's in Paris.","can't وقتی مطمئنیم درست نیست."],["About the past: must/might/can't + have + participle: She must have forgotten.","برای گذشته: must have / might have / can't have + قسمت سوم."]],"ex":[["You must be hungry after your journey.","حتماً بعد از سفر گرسنه‌ای."],["She might be in a meeting.","شاید در جلسه باشد."],["That can't be true!","امکان ندارد درست باشد!"],["He must have missed the train.","حتماً قطار را از دست داده."],["They might have got lost.","شاید گم شده باشند."],["She can't have seen us.","امکان ندارد ما را دیده باشد."]],"tip":"«حتماً» = must، «شاید» = might، «امکان ندارد» = can't (نه mustn't). mustn't برای ممنوعیت است، نه استنتاج.","d":[["He's been working all day. He ___ be exhausted.","must","can't","mustn't"],["I'm not sure where she is. She ___ be at the gym.","might","must","can't"],["That ___ be Sara. She's in Canada!","can't","mustn't","might"],["The ground is wet. It ___ have rained.","must","can't","should"],["He didn't answer. He ___ have been asleep.","might","can't","mustn't"],["She ___ have taken the car — the keys are here.","can't","must","might"],["You ___ be joking!","must","can","should"],["They're late. They ___ have got stuck in traffic.","may","can't","mustn't"]]},{"id":"g42","lv":"B2","t":"Future continuous & future perfect","fa":"آینده استمراری و آیندهٔ کامل","r":[["Future continuous (will be + -ing): an action in progress at a future time: This time tomorrow I'll be flying.","will be + ing: کاری که در زمانی در آینده در جریان خواهد بود."],["Future perfect (will have + participle): finished before a future time: By 2030 I'll have finished my degree.","will have + قسمت سوم: کاری که تا زمانی در آینده تمام شده است."],["Common with by (+ time), by the time, this time next week.","با by، by the time و this time next week."]],"ex":[["This time next week, I'll be lying on the beach.","هفتهٔ بعد همین موقع روی ساحل دراز کشیده‌ام."],["Don't call at eight — I'll be driving.","ساعت هشت زنگ نزن، در حال رانندگی‌ام."],["By Friday, we'll have finished the report.","تا جمعه گزارش را تمام کرده‌ایم."],["She'll have left by the time you arrive.","تا تو برسی، او رفته است."],["Will you be using the car tomorrow?","فردا ماشین را لازم داری؟"],["By next June, I'll have worked here for ten years.","تا ژوئن آینده ده سال است که این‌جا کار کرده‌ام."]],"tip":"Will you be using…? راهی بسیار مؤدبانه برای پرسیدن برنامهٔ کسی است، بدون اینکه درخواست مستقیم به نظر برسد.","d":[["At 10 tomorrow I ___ an exam.","will be taking","will have taken","take"],["By 2030 I ___ my degree.","will have finished","will be finishing","finish"],["Don't phone at seven. We ___ dinner.","'ll be having","'ll have had","have"],["By the time you arrive, the film ___.","will have started","will be starting","starts"],["___ you be using your laptop tonight?","Will","Do","Are"],["This time next year, she ___ in Canada.","will be living","will have lived","lives"],["They ___ the bridge by next summer.","will have built","will be built","build"],["I'll call you when I ___ work.","have finished","will have finished","will finish"]]},{"id":"g43","lv":"B2","t":"Contrast & purpose: although, despite, so that, in order to","fa":"تضاد و هدف","r":[["although/even though + clause: Although it was late, we went out.","although + جمله (فاعل و فعل)."],["despite/in spite of + noun or -ing: Despite the rain, we went out. Despite being tired, …","despite + اسم یا ing، بدون of بعد از despite."],["Purpose: to / in order to + verb; so that + clause (often with can/could/will).","هدف: to / in order to + فعل؛ so that + جمله."],["however/nevertheless start a new sentence: It was cheap. However, it broke.","however در شروع جملهٔ جدید و با ویرگول."]],"ex":[["Although he's rich, he lives simply.","با اینکه ثروتمند است، ساده زندگی می‌کند."],["Despite the traffic, we arrived on time.","با وجود ترافیک، به‌موقع رسیدیم."],["In spite of feeling ill, she went to work.","با وجود بیماری، سر کار رفت."],["I'm saving money to buy a house.","پول پس‌انداز می‌کنم تا خانه بخرم."],["Speak slowly so that everyone can understand.","آهسته صحبت کن تا همه بفهمند."],["We left early in order to avoid the traffic.","زود راه افتادیم تا به ترافیک نخوریم."]],"tip":"«با وجود» فارسی گاهی با جمله می‌آید، ولی در انگلیسی despite فقط با اسم یا ing است: Despite it was raining ✗ → Although it was raining ✓.","d":[["___ it was cold, we swam.","Although","Despite","In spite"],["___ the rain, the match continued.","Despite","Although","Even though"],["She went to work in spite of ___ ill.","feeling","she felt","feel"],["I study hard ___ pass the exam.","to","for","so"],["Turn it down ___ I can sleep.","so that","in order","despite"],["We left early ___ avoid traffic.","in order to","so that","for to"],["It was expensive. ___, we bought it.","However","Although","Despite"],["___ being tired, he finished the job.","Despite","Although","Even though"]]},{"id":"g27","lv":"C1","t":"Inversion for emphasis","fa":"وارونگی برای تأکید","r":[["After negative or limiting adverbs at the start, use question order: Never have I seen such a view.","اگر قید منفی یا محدودکننده اول جمله بیاید، ترتیب سؤالی می‌شود."],["Common starters: Never, Rarely, Seldom, Not only, No sooner… than, Hardly… when, Under no circumstances, Only then.","شروع‌کننده‌های رایج: Never, Rarely, Not only, No sooner, Under no circumstances."],["It is formal and dramatic: use it in writing, speeches and presentations.","این ساختار رسمی و تأکیدی است؛ برای نوشتار و سخنرانی."]],"ex":[["Never have I felt so welcome.","هرگز این‌قدر احساس خوش‌آمد نکرده بودم."],["Not only did she finish early, but she also helped others.","نه‌تنها زود تمام کرد، بلکه به دیگران هم کمک کرد."],["Rarely do we see such talent.","به‌ندرت چنین استعدادی می‌بینیم."],["No sooner had I arrived than it started to rain.","تازه رسیده بودم که باران شروع شد."],["Under no circumstances should you share your password.","تحت هیچ شرایطی نباید رمزتان را به کسی بدهید."],["Only then did I understand the problem.","تنها آن موقع بود که مشکل را فهمیدم."]],"tip":"در فارسی جابه‌جایی کلمات برای تأکید آزاد است، ولی در انگلیسی وارونگی فقط بعد از این قیدها و با فعل کمکی (do/have/should) ممکن است.","d":[["Never ___ such a beautiful sunset.","have I seen","I have seen","I saw"],["Not only ___ late, but he also forgot the tickets.","was he","he was","he is"],["Rarely ___ he complain.","does","he does","do"],["No sooner had we sat down ___ the phone rang.","than","when","that"],["Under no circumstances ___ open this door.","should you","you should","you must"],["Only later ___ the truth.","did she realise","she realised","she did realise"],["Hardly ___ started when the lights went out.","had the film","the film had","the film has"],["Seldom ___ such a generous offer.","do we receive","we receive","we do receive"]]},{"id":"g28","lv":"C1","t":"Cleft sentences: What… is, It is… that","fa":"جملات تأکیدی شکافته","r":[["It is/was + focus + that/who…: It was Sara who called. (not someone else)","It was + بخش مورد تأکید + that/who."],["What + clause + is/was…: What I need is a holiday.","What + جمله + is/was برای برجسته کردن."],["All (that) I want is…, The reason (why)… is…, The thing that… is…","ساختارهای مشابه: All I want is…, The reason why… is…"]],"ex":[["It was my brother who broke the window.","برادرم بود که پنجره را شکست."],["What I love about London is the parks.","چیزی که دربارهٔ لندن دوست دارم پارک‌هایش است."],["It's the price that worries me.","قیمتش است که نگرانم می‌کند."],["What we need is more time.","چیزی که لازم داریم زمان بیشتر است."],["All I want is a quiet weekend.","تنها چیزی که می‌خواهم یک آخر هفتهٔ آرام است."],["The reason I called is to apologise.","دلیل تماسم عذرخواهی است."]],"tip":"این ساختار معادل «...بود که...» در فارسی است و برای اصلاح سوءتفاهم بسیار کاربردی است: It was Tuesday, not Monday, that we met.","d":[["___ was Ali who told me.","It","What","That"],["What I need ___ a good night's sleep.","is","it is","that"],["It's the noise ___ annoys me.","that","what","who"],["___ I like most is the food.","What","It","That"],["All I want ___ to go home.","is","it","what"],["It was in 2010 ___ we met.","that","what","which"],["The reason ___ I'm late is the traffic.","why","what","because"],["___ surprised me was his honesty.","What","It","That"]]},{"id":"g29","lv":"C1","t":"Advanced passive & causative (have/get something done)","fa":"مجهول پیشرفته و سببی","r":[["Causative: have/get + object + past participle = someone does it for you: I had my car repaired.","have/get + مفعول + قسمت سوم یعنی کسی کاری را برایتان انجام می‌دهد."],["Impersonal passive: It is said/believed that…; He is thought to be…","مجهول غیرشخصی: It is said that… / He is believed to be…"],["Passive with modals and perfect: It should be done. It has been decided.","مجهول با افعال وجهی و زمان کامل: should be done, has been decided."]],"ex":[["I'm having my hair cut tomorrow.","فردا موهایم را کوتاه می‌کنم (در آرایشگاه)."],["We got the roof fixed last week.","هفتهٔ پیش سقف را تعمیر کردیم (کسی برایمان)."],["It is believed that the city is 3,000 years old.","گمان می‌رود این شهر ۳۰۰۰ سال قدمت داشته باشد."],["He is said to be the best surgeon in the country.","گفته می‌شود او بهترین جراح کشور است."],["The decision has already been made.","تصمیم قبلاً گرفته شده است."],["This form must be signed by a manager.","این فرم باید به امضای مدیر برسد."]],"tip":"«ماشینم را تعمیر کردم» در فارسی ممکن است یعنی کسی دیگر تعمیر کرده؛ در انگلیسی اگر خودتان نکرده‌اید بگویید I had my car repaired.","d":[["I need to ___ my eyes tested.","have","make","do"],["She got her phone ___.","repaired","repair","repairing"],["It ___ that he lives abroad.","is said","says","is saying"],["He is believed ___ the money.","to have stolen","stealing","that he stole"],["The work must ___ by Friday.","be finished","finish","be finishing"],["We're having our kitchen ___ next month.","painted","paint","to paint"],["A decision ___ yet.","hasn't been made","hasn't made","isn't make"],["She is thought ___ the best candidate.","to be","being","be"]]},{"id":"g30","lv":"C1","t":"Hedging & softening","fa":"زبان محتاطانه و ملایم‌سازی","r":[["Softeners make opinions polite and academic: It seems that…, It would appear that…, tend to.","عبارات ملایم‌کننده نظر را مؤدبانه و علمی می‌کنند."],["Modals of possibility: may, might, could: This could lead to delays.","با may/might/could قطعیت را کم کنید."],["Adverbs: arguably, possibly, somewhat, relatively, to some extent.","قیدهایی مثل arguably, somewhat, to some extent."],["Polite disagreement: I'm not sure I agree… / I see it slightly differently.","مخالفت مؤدبانه: I'm not sure I agree / I see it slightly differently."]],"ex":[["It seems that the plan needs more work.","به نظر می‌رسد برنامه به کار بیشتری نیاز دارد."],["People tend to spend more in December.","مردم معمولاً در دسامبر بیشتر خرج می‌کنند."],["This could be a problem in the future.","این ممکن است در آینده مشکل‌ساز شود."],["The results are, to some extent, encouraging.","نتایج تا حدی امیدوارکننده است."],["It's arguably the best film of the year.","می‌توان گفت بهترین فیلم سال است."],["I'm not sure I'd agree with that.","مطمئن نیستم با آن موافق باشم."],["The price is somewhat higher than expected.","قیمت تا حدی بالاتر از انتظار است."]],"tip":"صراحت زیاد مثل You are wrong در انگلیسی (به‌ویژه بریتانیایی) بی‌ادبانه به نظر می‌رسد؛ بگویید I'm not sure that's quite right.","d":[["The new policy ___ to be working.","seems","is seem","seeming"],["Prices ___ rise next year, but it's not certain.","may","must","will definitely"],["People ___ to eat less in summer.","tend","tends","are tend"],["Choose the most polite disagreement:","I'm not sure I agree with that.","You're wrong.","That's stupid."],["The results are ___ disappointing.","somewhat","very totally","extremely absolutely"],["It ___ appear that the data is incomplete.","would","will","is"],["This is ___ the most important issue.","arguably","argue","argued"],["Choose the best hedge:","This could cause delays.","This causes delays, 100%.","This will destroy everything."]]},{"id":"g44","lv":"C1","t":"Participle clauses","fa":"عبارت‌های وصفی (participle clauses)","r":[["-ing clause for actions at the same time or a reason: Feeling tired, I went to bed.","عبارت ing‌دار برای هم‌زمانی یا دلیل: چون خسته بودم…"],["Having + participle for an earlier action: Having finished the report, she left.","Having + قسمت سوم برای کاری که قبلاً انجام شده."],["Past participle for passive meaning: Built in 1900, the bridge is still used.","قسمت سوم برای معنای مجهول: ساخته‌شده در…"],["The subject of both parts must be the same.","فاعل هر دو بخش باید یکی باشد."]],"ex":[["Walking home, I met an old friend.","در راه خانه، به دوستی قدیمی برخوردم."],["Not knowing the answer, he stayed silent.","چون جواب را نمی‌دانست، ساکت ماند."],["Having lived abroad, she understands the challenges.","چون در خارج زندگی کرده، چالش‌ها را درک می‌کند."],["Written in simple English, the book is easy to read.","این کتاب چون به انگلیسی ساده نوشته شده، آسان خوانده می‌شود."],["Having signed the contract, we started work.","پس از امضای قرارداد، کار را شروع کردیم."],["Asked about the delay, the manager apologised.","وقتی دربارهٔ تأخیر از مدیر سؤال شد، عذرخواهی کرد."]],"tip":"خطای رایج «فاعل آویزان»: Walking home, the rain started ✗ (باران راه نمی‌رفت!). درست: Walking home, I got caught in the rain.","d":[["___ tired, I went to bed early.","Feeling","Felt","Having feel"],["___ the email, she called the client.","Having read","Reading had","Read having"],["___ in 1890, the house needs repairs.","Built","Building","Having built"],["___ the answer, he said nothing.","Not knowing","Knowing not","Not knew"],["Choose the correct sentence:","Walking home, I saw a fox.","Walking home, a fox was seen by me running.","Walking home, the fox saw me."],["___ all his money, he had to borrow some.","Having spent","Spending had","Spent having"],["___ by thousands, the app is very popular.","Used","Using","Having used"],["___ in Iran, she speaks Persian fluently.","Born","Being born had","Bearing"]]},{"id":"g45","lv":"C1","t":"I'd rather, it's time, suggest that","fa":"I'd rather، it's time و suggest that","r":[["I'd rather + base verb (my preference): I'd rather stay home.","I'd rather + فعل ساده: ترجیح می‌دهم…"],["I'd rather + someone + past (preference about others): I'd rather you didn't smoke here.","I'd rather + شخص + گذشته: ترجیح می‌دهم تو…"],["It's (high) time + past: It's time we left. (= we should leave now)","It's time + گذشته: وقتش رسیده که…"],["suggest/recommend + (that) + subject + base verb: I suggest that he see a doctor. Or: suggest + -ing.","suggest that + فاعل + فعل ساده، یا suggest + ing."]],"ex":[["I'd rather walk than take the bus.","ترجیح می‌دهم پیاده بروم تا با اتوبوس."],["I'd rather you told me the truth.","ترجیح می‌دهم حقیقت را به من بگویی."],["It's time we went home.","وقتش است برویم خانه."],["It's high time you found a job.","دیگر وقتش رسیده که کاری پیدا کنی."],["The doctor suggested that she rest for a week.","دکتر پیشنهاد کرد یک هفته استراحت کند."],["I suggest taking the train.","پیشنهاد می‌کنم با قطار بروید."]],"tip":"suggest را با to نیاورید: I suggest you to go ✗ → I suggest (that) you go ✓ یا I suggest going ✓.","d":[["I'd rather ___ at home tonight.","stay","to stay","staying"],["I'd rather you ___ here.","didn't smoke","don't smoke","not smoke"],["It's time we ___.","left","leave","leaving"],["I suggest that he ___ a lawyer.","consult","consults to","to consult"],["She suggested ___ a taxi.","taking","to take","take"],["It's high time you ___ to bed.","went","go","going"],["Choose the correct sentence:","I suggest you call her.","I suggest you to call her.","I suggest calling to her you."],["Would you rather ___ tea or coffee?","have","having","to have"]]}],"extra":{"listen":[{"id":"p01","lv":"A1","t":"My new neighbour","fa":"همسایهٔ جدیدم","s":[["My name is Maryam and I live in a small flat in Manchester.","اسم من مریم است و در یک آپارتمان کوچک در منچستر زندگی می‌کنم."],["Last week a new neighbour moved in next door.","هفتهٔ پیش یک همسایهٔ جدید به واحد بغلی آمد."],["Her name is Grace. She's from Scotland and she's a nurse.","اسمش گریس است. اهل اسکاتلند و پرستار است."],["She works at night, so she sleeps in the morning.","شب‌ها کار می‌کند، پس صبح‌ها می‌خوابد."],["On Sunday, I made Persian tea and invited her in.","یکشنبه چای ایرانی درست کردم و دعوتش کردم بیاید تو."],["She loved the tea and now we are good friends.","عاشق چای شد و حالا دوستان خوبی هستیم."]],"q":[{"q":"What is Grace's job?","o":["She's a nurse","She's a teacher","She's a doctor"]},{"q":"Why does Grace sleep in the morning?","o":["She works at night","She is ill","She is on holiday"]}]},{"id":"p02","lv":"A1","t":"A day at the market","fa":"یک روز در بازار","s":[["Every Saturday morning, I go to the market with my son.","هر شنبه صبح با پسرم به بازار می‌روم."],["We buy fruit, vegetables and fresh bread.","میوه، سبزیجات و نان تازه می‌خریم."],["The apples are cheap, but the cherries are expensive.","سیب‌ها ارزان‌اند، ولی گیلاس‌ها گران‌اند."],["My son always wants a cake from the bakery.","پسرم همیشه از نانوایی یک کیک می‌خواهد."],["We pay in cash because some sellers don't take cards.","نقد می‌پردازیم چون بعضی فروشنده‌ها کارت قبول نمی‌کنند."],["At twelve o'clock, we go home and make lunch.","ساعت دوازده به خانه می‌رویم و ناهار درست می‌کنیم."]],"q":[{"q":"What is expensive at the market?","o":["The cherries","The apples","The bread"]},{"q":"Why do they pay in cash?","o":["Some sellers don't take cards","Cash is cheaper","They don't have a card"]}]},{"id":"p03","lv":"A2","t":"A trip to Edinburgh","fa":"سفری به ادینبرو","s":[["Last month my husband and I took the train to Edinburgh.","ماه گذشته من و شوهرم با قطار به ادینبرو رفتیم."],["The journey took four and a half hours, but the views were beautiful.","سفر چهار ساعت و نیم طول کشید، ولی مناظر زیبا بود."],["We stayed in a small hotel near the castle.","در هتل کوچکی نزدیک قلعه اقامت کردیم."],["On the first day it rained, so we visited the museum.","روز اول باران بارید، پس به موزه رفتیم."],["On the second day the sun came out and we climbed a hill called Arthur's Seat.","روز دوم آفتاب درآمد و از تپه‌ای به نام آرتورز سیت بالا رفتیم."],["We were tired, but it was the best part of the trip.","خسته بودیم، اما بهترین بخش سفر بود."]],"q":[{"q":"How did they travel to Edinburgh?","o":["By train","By plane","By car"]},{"q":"What did they do on the rainy day?","o":["They visited the museum","They climbed a hill","They stayed in the hotel"]}]},{"id":"p04","lv":"A2","t":"Voicemail from the dentist","fa":"پیام صوتی از دندان‌پزشکی","s":[["Hello, this is a message for Mr Hosseini from Bright Smile Dental.","سلام، این پیامی برای آقای حسینی از دندان‌پزشکی برایت اسمایل است."],["Your appointment is on Wednesday the fifth at 2:15.","وقت شما چهارشنبه پنجم ساعت ۲:۱۵ است."],["Unfortunately, Dr Lewis is ill that day.","متأسفانه دکتر لوئیس آن روز بیمار است."],["We can offer you Thursday at the same time, or Friday at 10 a.m.","می‌توانیم پنجشنبه همان ساعت یا جمعه ساعت ۱۰ صبح را پیشنهاد کنیم."],["Please call us back on 0161 496 0021.","لطفاً با شمارهٔ ۰۱۶۱ ۴۹۶ ۰۰۲۱ با ما تماس بگیرید."],["Thank you, and sorry for the change.","ممنون، و بابت تغییر عذر می‌خواهیم."]],"q":[{"q":"Why must the appointment change?","o":["The dentist is ill","The clinic is closed","Mr Hosseini is busy"]},{"q":"Which new times are offered?","o":["Thursday 2:15 or Friday 10 a.m.","Wednesday or Thursday","Friday 2:15 only"]}]},{"id":"p05","lv":"B1","t":"Learning to drive at forty","fa":"یادگیری رانندگی در چهل سالگی","s":[["I never learned to drive in Iran because I always lived in big cities with good public transport.","در ایران هرگز رانندگی یاد نگرفتم چون همیشه در شهرهای بزرگ با حمل‌ونقل عمومی خوب زندگی می‌کردم."],["When we moved to a village in England, everything changed.","وقتی به روستایی در انگلستان رفتیم، همه‌چیز عوض شد."],["The nearest supermarket was twelve kilometres away and the bus came twice a day.","نزدیک‌ترین سوپرمارکت دوازده کیلومتر دور بود و اتوبوس روزی دو بار می‌آمد."],["So, at forty, I booked my first driving lesson.","پس در چهل سالگی اولین جلسهٔ آموزش رانندگی را رزرو کردم."],["I failed my first test because I was too nervous at a roundabout.","در اولین امتحانم رد شدم چون سر یک میدان خیلی مضطرب بودم."],["I practised for two more months and passed the second time. Now I feel free.","دو ماه دیگر تمرین کردم و بار دوم قبول شدم. حالا احساس آزادی می‌کنم."]],"q":[{"q":"Why didn't the speaker learn to drive in Iran?","o":["Public transport was good","Cars were too expensive","She was too young"]},{"q":"Why did she fail the first test?","o":["She was nervous at a roundabout","She drove too fast","She was late"]}]},{"id":"p06","lv":"B1","t":"Tips for your first week at work","fa":"نکاتی برای هفتهٔ اول کار","s":[["Starting a new job can be stressful, but a few simple habits help.","شروع یک کار جدید می‌تواند استرس‌زا باشد، اما چند عادت ساده کمک می‌کند."],["First, arrive a little early and introduce yourself to your colleagues.","اول، کمی زودتر برسید و خودتان را به همکارانتان معرفی کنید."],["Don't be afraid to ask questions; people expect it in the first weeks.","از پرسیدن نترسید؛ در هفته‌های اول همه انتظارش را دارند."],["Take notes, because you will hear a lot of new names and systems.","یادداشت بردارید، چون نام‌ها و سیستم‌های جدید زیادی خواهید شنید."],["Try to join colleagues for lunch, even if you are shy.","سعی کنید ناهار را با همکاران بخورید، حتی اگر خجالتی هستید."],["Finally, ask your manager for feedback at the end of the first month.","در پایان، آخر ماه اول از مدیرتان بازخورد بخواهید."]],"q":[{"q":"Why should you take notes?","o":["You'll hear many new names and systems","Your boss checks them","It's a company rule"]},{"q":"When should you ask for feedback?","o":["At the end of the first month","On the first day","After a year"]}]},{"id":"p07","lv":"B1","t":"The return of the bicycle","fa":"بازگشت دوچرخه","s":[["In many European cities, bicycles are becoming more popular every year.","در بسیاری از شهرهای اروپا، دوچرخه هر سال محبوب‌تر می‌شود."],["Cities have built safe cycle lanes, separated from cars.","شهرها مسیرهای ایمن دوچرخه، جدا از خودروها، ساخته‌اند."],["Electric bikes have also made longer journeys and hills much easier.","دوچرخه‌های برقی هم سفرهای طولانی‌تر و سربالایی‌ها را بسیار آسان‌تر کرده‌اند."],["People say they save money and feel healthier.","مردم می‌گویند در هزینه صرفه‌جویی می‌کنند و احساس سلامتی بیشتری دارند."],["However, some shop owners worry that fewer parking spaces mean fewer customers.","با این حال، برخی مغازه‌داران نگران‌اند که پارکینگ کمتر یعنی مشتری کمتر."],["Studies show the opposite: cyclists visit shops more often and spend more per month.","مطالعات خلاف آن را نشان می‌دهد: دوچرخه‌سواران بیشتر به مغازه‌ها سر می‌زنند و ماهانه بیشتر خرج می‌کنند."]],"q":[{"q":"What made hills easier?","o":["Electric bikes","New roads","Cheaper bikes"]},{"q":"What do studies show about cyclists?","o":["They spend more per month in shops","They never go shopping","They prefer big supermarkets"]}]},{"id":"p08","lv":"B2","t":"Why we procrastinate","fa":"چرا کارها را به تعویق می‌اندازیم","s":[["Most of us have put off an important task until the last minute.","بیشتر ما یک کار مهم را تا لحظهٔ آخر عقب انداخته‌ایم."],["Psychologists argue that procrastination isn't really about laziness.","روان‌شناسان استدلال می‌کنند که تعلل واقعاً به تنبلی مربوط نیست."],["It's about avoiding the unpleasant feelings a task gives us, such as boredom or fear of failure.","بلکه به اجتناب از احساسات ناخوشایندی برمی‌گردد که یک کار به ما می‌دهد، مثل کسالت یا ترس از شکست."],["One effective strategy is to break a big task into very small steps.","یک راهبرد مؤثر این است که کار بزرگ را به گام‌های خیلی کوچک تقسیم کنیم."],["Another is the 'two-minute rule': if something takes less than two minutes, do it now.","دیگری «قانون دو دقیقه» است: اگر کاری کمتر از دو دقیقه طول می‌کشد، همین الان انجامش بده."],["Above all, being kind to yourself after a delay makes you less likely to delay again.","مهم‌تر از همه، مهربان بودن با خودتان بعد از یک تأخیر، احتمال تأخیر دوباره را کم می‌کند."]],"q":[{"q":"According to psychologists, procrastination is mainly about…","o":["avoiding unpleasant feelings","laziness","lack of time"]},{"q":"What is the 'two-minute rule'?","o":["Do short tasks immediately","Work for two minutes, then rest","Plan for two minutes every morning"]}]},{"id":"p09","lv":"B2","t":"Balancing the grid","fa":"متعادل‌سازی شبکهٔ برق","s":[["Electricity has to be produced at exactly the moment it is used.","برق باید دقیقاً در همان لحظه‌ای که مصرف می‌شود تولید شود."],["With more solar and wind power, supply now depends on the weather.","با افزایش انرژی خورشیدی و بادی، عرضه اکنون به آب‌وهوا بستگی دارد."],["On sunny afternoons there can be too much power, and in the evening too little.","در بعدازظهرهای آفتابی ممکن است برق بیش از حد باشد و عصرها خیلی کم."],["Large batteries solve part of this problem by storing cheap midday energy.","باتری‌های بزرگ با ذخیرهٔ انرژی ارزان ظهر، بخشی از این مشکل را حل می‌کنند."],["They can respond in milliseconds, which is far faster than a gas power station.","آن‌ها در چند میلی‌ثانیه واکنش نشان می‌دهند که بسیار سریع‌تر از یک نیروگاه گازی است."],["As battery prices fall, experts expect storage to become a standard part of every solar project.","با کاهش قیمت باتری، کارشناسان انتظار دارند ذخیره‌سازی بخش استاندارد هر پروژهٔ خورشیدی شود."]],"q":[{"q":"Why is solar and wind power a challenge for the grid?","o":["Supply depends on the weather","It is too expensive","It produces too much noise"]},{"q":"What advantage do batteries have over gas stations?","o":["They respond much faster","They are bigger","They work only at night"]}]},{"id":"p10","lv":"B2","t":"A complaint call","fa":"تماس برای شکایت","s":[["Good morning. I'm calling about an order I placed three weeks ago.","صبح بخیر. دربارهٔ سفارشی تماس می‌گیرم که سه هفته پیش ثبت کردم."],["The website said delivery would take five working days, but nothing has arrived.","وب‌سایت گفته بود تحویل پنج روز کاری طول می‌کشد، ولی هنوز چیزی نرسیده."],["I've emailed twice and haven't had a reply, which is frustrating.","دو بار ایمیل زده‌ام و پاسخی نگرفته‌ام که کلافه‌کننده است."],["I'd like to know where the parcel is, or else I'd like a full refund.","می‌خواهم بدانم بسته کجاست، وگرنه بازپرداخت کامل می‌خواهم."],["The agent apologised and explained that it had been sent to the wrong address.","کارمند عذرخواهی کرد و توضیح داد که بسته به آدرس اشتباه فرستاده شده بود."],["She offered to send a new one by express delivery at no extra cost.","او پیشنهاد کرد یک بستهٔ جدید با پست سریع بدون هزینهٔ اضافه بفرستد."]],"q":[{"q":"What had gone wrong?","o":["It was sent to the wrong address","It was broken","It was the wrong size"]},{"q":"What does the company offer?","o":["A new parcel by express delivery, free","A 10% discount","A refund only"]}]},{"id":"p11","lv":"C1","t":"The myth of multitasking","fa":"افسانهٔ چندکارگی","s":[["It's widely accepted that we live in an age of distraction, yet many of us still pride ourselves on multitasking.","به‌طور گسترده پذیرفته شده که در عصر حواس‌پرتی زندگی می‌کنیم، با این حال بسیاری از ما هنوز به چندکاره بودن خود می‌بالیم."],["Research suggests, however, that the brain doesn't truly do two demanding things at once.","با این حال، پژوهش‌ها نشان می‌دهد که مغز واقعاً دو کار دشوار را هم‌زمان انجام نمی‌دهد."],["Instead, it switches rapidly between them, and every switch carries a small cost in time and accuracy.","بلکه به‌سرعت بین آن‌ها جابه‌جا می‌شود و هر جابه‌جایی هزینهٔ کوچکی در زمان و دقت دارد."],["Over a day, these costs add up to a surprising loss of productivity.","در طول یک روز، این هزینه‌ها به افت شگفت‌آوری در بهره‌وری می‌انجامد."],["Not only does constant switching tire us, but it also makes deep thinking far less likely.","جابه‌جایی مداوم نه‌تنها ما را خسته می‌کند، بلکه احتمال تفکر عمیق را نیز بسیار کم می‌کند."],["The bottom line is that protecting blocks of uninterrupted time may be the most valuable skill of all.","خلاصهٔ کلام اینکه حفاظت از بازه‌های زمانی بدون وقفه شاید ارزشمندترین مهارت باشد."]],"q":[{"q":"What does the brain actually do when 'multitasking'?","o":["Switches quickly between tasks","Does both tasks at once","Ignores one task"]},{"q":"What is the speaker's main recommendation?","o":["Protect uninterrupted time","Do more tasks at once","Take more breaks"]}]},{"id":"p12","lv":"C1","t":"Living between two languages","fa":"زندگی میان دو زبان","s":[["When I first arrived in Canada, I assumed that fluency was simply a matter of vocabulary.","وقتی تازه به کانادا رسیدم، فکر می‌کردم روانی زبان صرفاً به دایرهٔ واژگان بستگی دارد."],["It took me years to realise that what really separates a fluent speaker is the ability to be subtle.","سال‌ها طول کشید تا بفهمم آنچه واقعاً یک گویندهٔ روان را متمایز می‌کند، توانایی بیان ظریف است."],["In Persian, I could soften a refusal with a dozen polite phrases; in English I sounded blunt without meaning to.","در فارسی می‌توانستم یک «نه» را با ده‌ها عبارت مؤدبانه نرم کنم؛ در انگلیسی بی‌آنکه بخواهم رُک به نظر می‌رسیدم."],["Gradually, I learned expressions like 'I'm not sure that would work' and 'that's a fair point, but…'.","به‌تدریج عباراتی مثل «مطمئن نیستم جواب بدهد» و «نکتهٔ منصفانه‌ای است، اما...» را یاد گرفتم."],["Interestingly, the Persian habit of taarof turned out to be a blessing in disguise: I already understood that politeness is a skill.","جالب اینکه عادت تعارف ایرانی خیری پنهان از آب درآمد: از قبل می‌دانستم که ادب یک مهارت است."],["Now I feel I don't just translate myself; I can actually be myself in both languages.","حالا احساس می‌کنم فقط خودم را ترجمه نمی‌کنم؛ واقعاً می‌توانم در هر دو زبان خودم باشم."]],"q":[{"q":"What did the speaker think fluency was at first?","o":["A matter of vocabulary","A matter of accent","A matter of grammar"]},{"q":"How did taarof help the speaker?","o":["It taught that politeness is a skill","It made English easier to pronounce","It helped with writing"]}]}],"sounds":[{"id":"s1","t":"th: /θ/ and /ð/","fa":"صدای th","fa2":"فارسی این صدا را ندارد. نوک زبان را آرام بین دندان‌ها بگذارید و هوا را بیرون بدهید. think را «سینک» یا «تینک» نگویید.","p":[["think","sink"],["three","tree"],["this","dis"],["thank","tank"],["mouth","mouse"]]},{"id":"s2","t":"v and w","fa":"تفاوت v و w","fa2":"برای w لب‌ها را گرد کنید (مثل «و» در «نو» با لب گرد) و دندان به لب نخورد. برای v دندان بالا روی لب پایین است. wine و vine را متفاوت بگویید.","p":[["wine","vine"],["west","vest"],["wet","vet"],["worse","verse"],["while","vile"]]},{"id":"s3","t":"No extra 'e' before s + consonant","fa":"اضافه نکردن «اِ» قبل از s","fa2":"فارسی‌زبان‌ها school را «اِسکول» می‌گویند. مستقیم با s شروع کنید: s-chool، s-treet، s-port.","p":[["school","eschool ✗"],["street","estreet ✗"],["Spain","Espain ✗"],["student","estudent ✗"],["sport","esport ✗"]]},{"id":"s4","t":"Short /ɪ/ vs long /iː/","fa":"«ای» کوتاه و بلند","fa2":"ship کوتاه و شل است، sheep بلند و کشیده. اگر کوتاه و بلند را یکی کنید معنی عوض می‌شود.","p":[["ship","sheep"],["live","leave"],["fill","feel"],["sit","seat"],["bit","beat"]]},{"id":"s5","t":"/æ/ vs /e/","fa":"«اَ» باز و «اِ»","fa2":"در man دهان بازتر است (نزدیک «اَ» فارسی)، در men کمتر باز (نزدیک «اِ»).","p":[["man","men"],["bad","bed"],["sad","said"],["pan","pen"],["had","head"]]},{"id":"s6","t":"Word stress","fa":"تکیهٔ کلمه","fa2":"در فارسی تکیه اغلب روی هجای آخر است، در انگلیسی معمولاً نه. بخش بزرگ‌نوشته را قوی‌تر بگویید.","p":[["PHOtograph","phoTOgraphy"],["COMfortable","—"],["VEgetable","—"],["deVElop","—"],["eCOnomy","ecoNOmic"]]},{"id":"s7","t":"Final consonants: -ed and -s","fa":"صامت‌های پایانی","fa2":"صامت آخر کلمه را کامل بگویید و حرف صدادار اضافه نکنید: worked = /wɜːkt/ (نه «ورکِد»)، books = /bʊks/.","p":[["worked","/t/"],["played","/d/"],["wanted","/ɪd/"],["books","/s/"],["dogs","/z/"]]},{"id":"s8","t":"Silent letters","fa":"حروف بی‌صدا","fa2":"این حروف نوشته می‌شوند ولی تلفظ نمی‌شوند: k در know، w در write، b در climb، l در walk، h در hour.","p":[["know","no"],["write","right"],["climb","clime"],["walk","wok"],["hour","our"]]}],"road":[{"lv":"A1","t":"Breakthrough","fa":"آغاز","hours":"60–80","can":[["Introduce yourself and others.","خود و دیگران را معرفی کنید."],["Ask and answer simple questions about home, family and work.","سؤالات ساده دربارهٔ خانه، خانواده و کار بپرسید و پاسخ دهید."],["Shop, order food and ask the way using short phrases.","با عبارات کوتاه خرید کنید، غذا سفارش دهید و آدرس بپرسید."]],"out":[["Label things at home in English.","وسایل خانه را با برچسب انگلیسی نام‌گذاری کنید."],["Watch 5 minutes of a children's English cartoon daily.","روزی ۵ دقیقه کارتون انگلیسی کودکان ببینید."]]},{"lv":"A2","t":"Waystage","fa":"گام دوم","hours":"100–150","can":[["Talk about your past, plans and routines.","دربارهٔ گذشته، برنامه‌ها و کارهای روزمره صحبت کنید."],["Handle travel, health and restaurant situations.","از پس موقعیت‌های سفر، سلامت و رستوران برآیید."],["Write short messages and emails.","پیام‌ها و ایمیل‌های کوتاه بنویسید."]],"out":[["Change your phone's language to English.","زبان گوشی‌تان را انگلیسی کنید."],["Write three sentences a day about your day.","روزی سه جمله دربارهٔ روزتان بنویسید."]]},{"lv":"B1","t":"Threshold","fa":"آستانه","hours":"180–260","can":[["Deal with most everyday situations: bank, doctor, landlord.","با بیشتر موقعیت‌های روزمره (بانک، دکتر، صاحب‌خانه) کنار بیایید."],["Describe experiences, feelings and opinions with reasons.","تجربه‌ها، احساسات و نظرات را با دلیل توضیح دهید."],["Follow the main points of clear speech on familiar topics.","نکات اصلی گفتار واضح دربارهٔ موضوعات آشنا را بفهمید."]],"out":[["Watch a TV series with English subtitles.","یک سریال را با زیرنویس انگلیسی ببینید."],["Find a speaking partner once a week.","هفته‌ای یک بار با یک هم‌صحبت تمرین کنید."]]},{"lv":"B2","t":"Vantage","fa":"پیشرفته","hours":"200–300","can":[["Take part in meetings and discussions with confidence.","با اعتمادبه‌نفس در جلسات و بحث‌ها شرکت کنید."],["Understand the news, podcasts and most films.","اخبار، پادکست‌ها و بیشتر فیلم‌ها را بفهمید."],["Argue a point with advantages and disadvantages.","با ذکر مزایا و معایب از نظری دفاع کنید."]],"out":[["Listen to a podcast without subtitles every day.","هر روز بدون زیرنویس پادکست گوش دهید."],["Write one email or short essay a week and get it corrected.","هفته‌ای یک ایمیل یا متن کوتاه بنویسید و اصلاحش را بگیرید."]]},{"lv":"C1","t":"Effective operational proficiency","fa":"تسلط کارآمد","hours":"200–300","can":[["Express yourself fluently without searching for words.","بدون جست‌وجوی کلمات، روان صحبت کنید."],["Use formal, polite and nuanced language as needed.","بسته به موقعیت از زبان رسمی، مؤدبانه و ظریف استفاده کنید."],["Understand implicit meaning, idioms and long complex texts.","معنای ضمنی، اصطلاحات و متون طولانی و پیچیده را بفهمید."]],"out":[["Read a novel or long articles in English.","یک رمان یا مقالات طولانی انگلیسی بخوانید."],["Give a short presentation and record yourself.","یک ارائهٔ کوتاه بدهید و صدای خود را ضبط کنید."],["Prepare for IELTS (7.0+) or Cambridge C1 Advanced if you need a certificate.","اگر مدرک لازم دارید، برای آیلتس (۷ به بالا) یا Cambridge C1 Advanced آماده شوید."]]}]}};

/* ------------------------------ session runner ------------------------------ */
const RUN = () => $('#run');

function startSession(items, title, onEnd) {
  if (!items.length) return toast('Nothing to practise right now 🎉');

  const r = RUN(); r.style.display = 'flex'; document.body.style.overflow = 'hidden';
  r.innerHTML = `<div class="runtop"><button class="icob" id="rx">✕</button><div class="runbar"><div class="bar"><i id="rbar" style="width:0"></i></div></div><span class="xs" id="rcount"></span></div><div class="runbody" id="rbody"></div>`;
  $('#rx').onclick = () => { if (confirm('Stop this session? Your progress so far is saved.')) endSession(true); };

}
function step() {
  if (!sess) return;

  const it = sess.items[sess.i], body = $('#rbody');
  body.innerHTML = ''; body.dataset.done = ''; body.scrollTop = 0;
  $('#rbar').style.width = (100 * sess.i / sess.items.length) + '%';
  $('#rcount').textContent = (sess.i + 1) + '/' + sess.items.length;
  try { it.render(body, (ok, cor) => answered(it, ok, cor)); }
  catch (e) { logErr('render ' + it.key + ' ' + e.message); sess.i++; step(); }
}
function answered(it, ok, cor) {
  if (it.noGrade) { sess.i++; return step(); }
  sess.n++; if (ok) sess.ok++;
  if (!it.retry) { if (it.grade) it.grade(ok); if (ok) missNote(it.key, true); }
  if (!ok && !it.retry && it.remake && sess.retries < 10) {   // a wrong answer comes back three cards later
    const r = it.remake(); r.retry = true; sess.retries++;
    sess.items.splice(Math.min(sess.items.length, sess.i + 4), 0, r);
  }
  const body = $('#rbody');
  const fb = el('div', 'feedback ' + (ok ? 'ok' : 'bad'), (ok ? '✓ Correct! · درست است' : '✗ Not quite · نادرست') + (it.feedback ? `<div style="margin-top:6px">${it.feedback()}</div>` : ''));
  body.appendChild(fb);
  const nb = el('button', 'btn', 'Continue →'); nb.style.marginTop = '12px';
  nb.onclick = () => { stopSpeech(); sess.i++; step(); };
  body.appendChild(nb); nb.scrollIntoView({ behavior: 'smooth', block: 'end' });

}

/* ------------------------------ building sessions ------------------------------ */
function missItems(limit) {
  const out = [];
  Object.entries(ST.miss).sort((a, b) => a[1].t - b[1].t).forEach(([k]) => {
    if (out.length >= limit) return;
    const p = k.split(':');
    if (p[0] === 'w' && WMAP[p[1]]) out.push(wordEx(WMAP[p[1]]));
    else if (p[0] === 'g' && GMAP[p[1]] && GMAP[p[1]].d[+p[2]]) out.push(grammarDrill(GMAP[p[1]], +p[2]));
    else if (p[0] === 'l' && UMAP[p[1]]) out.push(dlgQuestion(UMAP[p[1]], +p[2]));
    else if (p[0] === 'p') { const P = LISTEN.find(x => x.id === p[1]); if (P) out.push(passageQ(P, +p[2])); }
    else delete ST.miss[k];
  });
  return out;
}
function buildDaily() {
  const items = [], usedW = new Set();
  // 1. warm-up: mistakes from earlier sessions
  missItems(8).forEach(x => { items.push(x); if (x.w) usedW.add(x.w.id); });
  // 2. due reviews
  const due = dueList().filter(w => !usedW.has(w.id)).slice(0, 12);
  due.slice(0, 6).forEach(w => { items.push(wordEx(w)); usedW.add(w.id); });
  // 3. new words of the next lesson: intro card, then a check after every two
  const L = nextLesson(); const fresh = L ? L.words.filter(id => !ST.cards[id]).slice(0, ST.perDay || 8).map(id => WMAP[id]) : [];
  const half = Math.ceil(fresh.length / 2);
  const intro = (ws, off) => { ws.forEach((w, i) => { items.push(introCard(w, L, off + i, fresh.length)); if (i % 2 === 1) { items.push(wordEx(ws[i - 1], 'en2fa')); items.push(wordEx(w, 'listen')); } }); if (ws.length % 2) items.push(wordEx(ws[ws.length - 1], 'en2fa')); };
  intro(fresh.slice(0, half), 0);
  // 4. grammar every day: the next rule on the path, or a review of the oldest learned rule
  const g = nextGrammar();
  if (g) { const seen = ST.gram[g.id] && ST.gram[g.id].t; items.push(grammarTeach(g, false)); pick([...g.d.keys()], 4).forEach(k => items.push(grammarDrill(g, k))); }
  else { const rv = gramReviewPool()[0]; if (rv) { items.push(grammarTeach(rv, true)); pick([...rv.d.keys()], 3).forEach(k => items.push(grammarDrill(rv, k))); } }
  intro(fresh.slice(half), half);
  // 5. remaining reviews, mixed with production practice of today's words
  due.slice(6).forEach(w => items.push(wordEx(w)));
  fresh.forEach(w => { if (blankIn(w.ex, w.w)) items.push(wordEx(w, 'cloze')); });
  // 6. listening: when today's lesson finishes a unit, hear its dialogue and answer
  if (L && L.k === Math.ceil(UMAP[L.u].w.length / 8) - 1 && fresh.length && !ST.dlg[L.u]) { const u = UMAP[L.u]; items.push(dialogueCard(u, true)); u.d.q.forEach((_, k) => items.push(dlgQuestion(u, k))); }
  return items;
}
